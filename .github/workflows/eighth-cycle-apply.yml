name: Eighth Cycle Corrective Apply

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - '.github/workflows/eighth-cycle-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0

      - name: Apply eighth-cycle patches
        run: |
          set -euo pipefail
          git apply --check tools/eighth-r1-5.patch
          git apply tools/eighth-r1-5.patch
          git apply --check tools/eighth-r6-10.patch
          git apply tools/eighth-r6-10.patch
          php -l includes/class-spf-idempotency.php
          php -l includes/class-spf-governance.php
          php -l includes/class-spf-reconciler.php
          php -l includes/class-spf-system-check.php
          php -l includes/class-spf-platform-engineering.php
          php -l includes/class-spf-resilience-lab.php
          php -l includes/class-spf-governance-control-plane.php
          php tests/eighth-ten-round-review-tests.php

      - name: Remove temporary patch artifacts and refresh exact checksums
        run: |
          set -euo pipefail
          git rm tools/eighth-r1-5.patch tools/eighth-r6-10.patch .github/workflows/eighth-cycle-apply.yml
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
          bash qa/run-tests.sh

      - name: Commit corrected clean head
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply eighth ten-round corrective cycle'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
