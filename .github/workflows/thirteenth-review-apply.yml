name: Thirteenth Review Apply

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .github/workflows/thirteenth-review-apply.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: file-01-thirteenth-review-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: codex/file-01-complete-foundation-1.0.0
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Reassemble, verify, squash and publish non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          cat \
            tools/.th13-parts/part00.txt \
            tools/.th13-parts/part01.txt \
            tools/.th13-parts/part02.txt \
            tools/.th13-parts/part03.txt \
            tools/.th13-parts/part04.txt \
            tools/.th13-parts/part05.txt \
            tools/.th13-parts/part06.txt \
            > /tmp/apply-thirteenth-review.py
          python3 -m py_compile /tmp/apply-thirteenth-review.py
          python3 /tmp/apply-thirteenth-review.py

          # Preserve the two current workflow files in the token-authenticated push.
          # Their exact final state is applied afterward through the GitHub connector,
          # which is allowed to modify workflow files.
          git reset --mixed "$BASE_HEAD"
          git checkout "$BASE_HEAD" -- .github/workflows/corrective-qa.yml .github/workflows/thirteenth-review-apply.yml

          # Regenerate an interim closed-world manifest for this exact publishable tree.
          tmp_manifest="$(mktemp)"
          find . -type f \
            -not -path './.git/*' \
            -not -path './build/*' \
            -not -path './dist/*' \
            ! -name 'SOURCE-CHECKSUMS.sha256' \
            -print | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done > "$tmp_manifest"
          mv "$tmp_manifest" SOURCE-CHECKSUMS.sha256

          bash qa/run-tests.sh
          git add -A
          git commit -m 'fix(review): publish thirteenth reviewed source pending workflow parity'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
          echo "INTERIM_HEAD=$(git rev-parse HEAD)"
      - name: Record interim published tree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
