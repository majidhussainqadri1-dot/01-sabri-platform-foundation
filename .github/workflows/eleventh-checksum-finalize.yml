name: File 01 Eleventh Checksum Finalize
on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Regenerate final-tree source manifest excluding this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' ! -path './.github/workflows/eleventh-checksum-finalize.yml' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
      - name: Commit only source manifest
        run: |
          git config user.name 'File 01 Corrective QA'
          git config user.email 'actions@users.noreply.github.com'
          git add SOURCE-CHECKSUMS.sha256
          git commit -m 'chore: bind source manifest to corrected ten-round tree'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
