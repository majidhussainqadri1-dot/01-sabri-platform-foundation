name: File 01 final Review-Fix Round 1 corrections

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .file01-round1-fixes.trigger

permissions:
  contents: write

concurrency:
  group: file01-round1-fixes
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Apply Round 1 plan-compliance corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              c=s.count(old)
              if c != 1: raise SystemExit(f'{label}: expected one anchor, found {c}')
              return s.replace(old,new,1)

          # Installer: explicit event privacy class + required index integrity.
          p=Path('includes/class-spf-installer.php'); s=p.read_text()
          s=once(s,
          "\t\t\tpayload_json longtext NOT NULL,\n\t\t\tstatus varchar(32) NOT NULL,",
          "\t\t\tpayload_json longtext NOT NULL,\n\t\t\tprivacy_class varchar(32) NOT NULL DEFAULT 'internal',\n\t\t\tstatus varchar(32) NOT NULL,", 'outbox privacy column')
          s=once(s,
          "\t\t\t'outbox'=>array('event_id','event_name','event_version','aggregate_type','aggregate_id','dedupe_key','payload_json','status','attempts','available_at','created_at'),",
          "\t\t\t'outbox'=>array('event_id','event_name','event_version','aggregate_type','aggregate_id','dedupe_key','payload_json','privacy_class','status','attempts','available_at','created_at'),", 'outbox required column')
          s=once(s,
          "\t\t$transactional = SPF_Runtime::verify_owned_tables_transactional();\n\t\tif ( is_wp_error( $transactional ) ) {\n\t\t\treturn $transactional;\n\t\t}\n\t\treturn true;\n\t}\n\n\tpublic static function seed_foundation() {",
          "\t\t$indexes = self::verify_required_indexes();\n\t\tif ( is_wp_error( $indexes ) ) {\n\t\t\treturn $indexes;\n\t\t}\n\t\t$transactional = SPF_Runtime::verify_owned_tables_transactional();\n\t\tif ( is_wp_error( $transactional ) ) {\n\t\t\treturn $transactional;\n\t\t}\n\t\treturn true;\n\t}\n\n\tpublic static function required_indexes() {\n\t\treturn array(\n\t\t\t'modules'=>array('PRIMARY'=>array(array('id'),true),'module_key'=>array(array('module_key'),true),'owner_file'=>array(array('owner_file'),false),'state'=>array(array('state'),false)),\n\t\t\t'contracts'=>array('PRIMARY'=>array(array('id'),true),'contract_identity'=>array(array('contract_key','contract_version'),true),'owner_module'=>array(array('owner_module'),false),'status'=>array(array('status'),false)),\n\t\t\t'contract_acks'=>array('PRIMARY'=>array(array('contract_key','contract_version','consumer_module'),true)),\n\t\t\t'routes'=>array('PRIMARY'=>array(array('id'),true),'route_key'=>array(array('route_key'),true),'route_path'=>array(array('route_path'),true),'owner_module'=>array(array('owner_module'),false),'status'=>array(array('status'),false)),\n\t\t\t'releases'=>array('PRIMARY'=>array(array('id'),true),'release_id'=>array(array('release_id'),true),'software_version_unique'=>array(array('software_version'),true),'status'=>array(array('status'),false)),\n\t\t\t'release_states'=>array('PRIMARY'=>array(array('id'),true),'release_sequence'=>array(array('release_id','sequence_no'),true),'release_id'=>array(array('release_id'),false),'status'=>array(array('status'),false)),\n\t\t\t'amendments'=>array('PRIMARY'=>array(array('id'),true),'amendment_id'=>array(array('amendment_id'),true),'status'=>array(array('status'),false)),\n\t\t\t'health'=>array('PRIMARY'=>array(array('id'),true),'trace_id'=>array(array('trace_id'),true),'overall_status'=>array(array('overall_status'),false),'created_at'=>array(array('created_at'),false)),\n\t\t\t'flags'=>array('PRIMARY'=>array(array('id'),true),'flag_identity'=>array(array('owner_module','flag_key','environment'),true),'expires_at'=>array(array('expires_at'),false)),\n\t\t\t'audit'=>array('PRIMARY'=>array(array('id'),true),'entry_hash'=>array(array('entry_hash'),true),'trace_id'=>array(array('trace_id'),false),'actor_id'=>array(array('actor_id'),false),'created_at'=>array(array('created_at'),false)),\n\t\t\t'idempotency'=>array('PRIMARY'=>array(array('id'),true),'scope_hash'=>array(array('scope_hash'),true),'expires_at'=>array(array('expires_at'),false),'status'=>array(array('status'),false)),\n\t\t\t'outbox'=>array('PRIMARY'=>array(array('id'),true),'event_id'=>array(array('event_id'),true),'dedupe_key'=>array(array('dedupe_key'),true),'due'=>array(array('status','available_at'),false),'created_at'=>array(array('created_at'),false)),\n\t\t\t'privacy_requests'=>array('PRIMARY'=>array(array('id'),true),'request_id'=>array(array('request_id'),true),'user_status'=>array(array('user_id','status'),false),'due'=>array(array('status','due_at'),false)),\n\t\t\t'privacy_holds'=>array('PRIMARY'=>array(array('id'),true),'hold_id'=>array(array('hold_id'),true),'subject_active'=>array(array('subject_user_id','active'),false)),\n\t\t\t'migrations'=>array('PRIMARY'=>array(array('id'),true),'migration_key'=>array(array('migration_key'),true),'status'=>array(array('status'),false)),\n\t\t);\n\t}\n\n\tpublic static function verify_required_indexes() {\n\t\tglobal $wpdb;\n\t\tforeach ( self::required_indexes() as $name => $required ) {\n\t\t\t$table = self::table( $name );\n\t\t\tif ( ! SPF_Runtime::table_exists( $table ) ) {\n\t\t\t\treturn new WP_Error( 'spf_schema_missing_table', 'Missing File 01 table: ' . $name );\n\t\t\t}\n\t\t\t$rows = $wpdb->get_results( 'SHOW INDEX FROM ' . $table, ARRAY_A ); // phpcs:ignore WordPress.DB.PreparedSQL.NotPrepared -- allowlisted File 01 table.\n\t\t\t$actual = array();\n\t\t\tforeach ( (array) $rows as $row ) {\n\t\t\t\t$key = (string) $row['Key_name'];\n\t\t\t\t$seq = (int) $row['Seq_in_index'];\n\t\t\t\t$actual[$key]['columns'][$seq] = (string) $row['Column_name'];\n\t\t\t\t$actual[$key]['unique'] = 0 === (int) $row['Non_unique'];\n\t\t\t}\n\t\t\tforeach ( $actual as &$index ) { ksort( $index['columns'] ); $index['columns'] = array_values( $index['columns'] ); } unset($index);\n\t\t\tforeach ( $required as $key => $spec ) {\n\t\t\t\tlist( $columns, $unique ) = $spec;\n\t\t\t\tif ( empty( $actual[$key] ) || $actual[$key]['columns'] !== $columns || (bool)$actual[$key]['unique'] !== (bool)$unique ) {\n\t\t\t\t\treturn new WP_Error( 'spf_schema_index_invalid', 'Missing or invalid File 01 index: ' . $name . '.' . $key, array('table'=>$name,'index'=>$key,'expected_columns'=>$columns,'expected_unique'=>(bool)$unique) );\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\treturn true;\n\t}\n\n\tpublic static function seed_foundation() {", 'index verifier')
          p.write_text(s)

          # Event bus: privacy classification is mandatory and durable.
          p=Path('includes/class-spf-event-bus.php'); s=p.read_text()
          s=once(s,
          "\tpublic static function publish( $event_name, $aggregate_type, $aggregate_id, array $payload, $version = 1, $dedupe_key = '' ) {",
          "\tpublic static function publish( $event_name, $aggregate_type, $aggregate_id, array $payload, $version = 1, $dedupe_key = '', $privacy_class = 'internal' ) {", 'publish signature')
          s=once(s,
          "\t\tif ( ! $event_name || ! $aggregate_type || ! $aggregate_id || $version < 1 ) {\n\t\t\treturn new WP_Error( 'spf_invalid_event', __( 'Invalid event contract.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\t$payload = self::sanitize_payload( $payload );",
          "\t\tif ( ! $event_name || ! $aggregate_type || ! $aggregate_id || $version < 1 ) {\n\t\t\treturn new WP_Error( 'spf_invalid_event', __( 'Invalid event contract.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\t$privacy_class = sanitize_key( $privacy_class );\n\t\tif ( ! in_array( $privacy_class, array( 'public','internal','restricted','confidential','ephemeral' ), true ) ) {\n\t\t\treturn new WP_Error( 'spf_invalid_event_privacy_class', __( 'A valid event privacy classification is required.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\t$payload = self::sanitize_payload( $payload );", 'privacy validation')
          s=once(s,
          "\t\t\t\t'aggregate_id'=>$aggregate_id,'dedupe_key'=>$dedupe_key,'payload_json'=>$payload_json,\n\t\t\t\t'status'=>'pending','attempts'=>0,'available_at'=>$now,'created_at'=>$now,\n\t\t\t),\n\t\t\tarray( '%s','%s','%d','%s','%s','%s','%s','%s','%d','%s','%s' )",
          "\t\t\t\t'aggregate_id'=>$aggregate_id,'dedupe_key'=>$dedupe_key,'payload_json'=>$payload_json,'privacy_class'=>$privacy_class,\n\t\t\t\t'status'=>'pending','attempts'=>0,'available_at'=>$now,'created_at'=>$now,\n\t\t\t),\n\t\t\tarray( '%s','%s','%d','%s','%s','%s','%s','%s','%s','%d','%s','%s' )", 'privacy insert')
          p.write_text(s)

          # Feature activation: dependency + independently verified migration/health/rollback/gate evidence.
          p=Path('includes/class-spf-governance.php'); s=p.read_text()
          anchor="\t\tif ( $old && (int) $context['expected_version'] !== (int) $old['record_version'] ) {\n\t\t\treturn new WP_Error( 'spf_stale_record', __( 'The feature flag changed before this update.', 'sabri-platform-foundation' ), array( 'status' => 409 ) );\n\t\t}\n"
          replacement=anchor+"\t\t$activation_evidence_hash = '';\n\t\tif ( ! empty( $flag['enabled'] ) ) {\n\t\t\t$readiness = SPF_Dependency_Resolver::readiness( $owner );\n\t\t\tif ( empty( $readiness['ready'] ) ) {\n\t\t\t\treturn new WP_Error( 'spf_feature_dependency_not_ready', __( 'Feature activation is blocked because the owner dependency graph is not ready.', 'sabri-platform-foundation' ), array( 'status'=>412, 'readiness_code'=>$readiness['code'] ?? 'not_ready' ) );\n\t\t\t}\n\t\t\t$activation = SPF_Runtime::verify_evidence(\n\t\t\t\t'spf_verify_feature_activation_evidence',\n\t\t\t\tarray( 'owner_module'=>$owner,'flag_key'=>$key,'environment'=>$env,'readiness_hash'=>SPF_Runtime::hash($readiness) ),\n\t\t\t\tarray( 'migration_status','health_status','rollback_evidence','gate_evidence','verifier','expires_at' )\n\t\t\t);\n\t\t\tif ( is_wp_error( $activation ) ) { return $activation; }\n\t\t\tif ( ! in_array( sanitize_key( $activation['migration_status'] ), array( 'ready','not_required' ), true ) || 'pass' !== sanitize_key( $activation['health_status'] ) ) {\n\t\t\t\treturn new WP_Error( 'spf_feature_activation_evidence_failed', __( 'Feature activation evidence does not prove migration and health readiness.', 'sabri-platform-foundation' ), array( 'status'=>412 ) );\n\t\t\t}\n\t\t\t$activation_evidence_hash = $activation['evidence_hash'];\n\t\t}\n"
          s=once(s,anchor,replacement,'feature activation gate')
          s=s.replace("array( 'purpose'=>$context['purpose']??'feature_flag' ) );\n\t\tif ( is_wp_error( $pre ) )", "array( 'purpose'=>$context['purpose']??'feature_flag','activation_evidence_hash'=>$activation_evidence_hash ) );\n\t\tif ( is_wp_error( $pre ) )",1)
          s=s.replace("array( 'purpose'=>$context['purpose']??'feature_flag','enabled'=>empty($flag['enabled'])?0:1 ) );", "array( 'purpose'=>$context['purpose']??'feature_flag','enabled'=>empty($flag['enabled'])?0:1,'activation_evidence_hash'=>$activation_evidence_hash ) );",1)
          p.write_text(s)

          # Runtime QA: prove fail-closed activation and positive verified activation.
          p=Path('qa/wp-runtime-smoke.php'); s=p.read_text()
          s=once(s,
          "$flag = SPF_Governance::set_flag( [ 'owner_module'=>'file-01','flag_key'=>'runtime_probe','environment'=>'all','enabled'=>true,'reason'=>'runtime test' ], [ 'purpose'=>'feature_flag' ] );",
          "$ungated_flag = SPF_Governance::set_flag( [ 'owner_module'=>'file-01','flag_key'=>'runtime_probe','environment'=>'all','enabled'=>true,'reason'=>'runtime test' ], [ 'purpose'=>'feature_flag' ] );\n$assert( is_wp_error( $ungated_flag ) && 'spf_evidence_unverified' === $ungated_flag->get_error_code(), 'Feature activation did not fail closed without migration/health/rollback/gate evidence.' );\nadd_filter( 'spf_verify_feature_activation_evidence', static fn() => [ 'verified'=>true,'migration_status'=>'ready','health_status'=>'pass','rollback_evidence'=>'ci-rollback-ready','gate_evidence'=>'ci-gate-proof','verifier'=>'CI runtime','expires_at'=>gmdate('c',time()+3600) ] );\n$flag = SPF_Governance::set_flag( [ 'owner_module'=>'file-01','flag_key'=>'runtime_probe','environment'=>'all','enabled'=>true,'reason'=>'runtime test' ], [ 'purpose'=>'feature_flag' ] );", 'runtime feature gate')
          s=once(s,
          "$assert( ! is_wp_error( $schema ), 'Schema verification failed: ' . ( is_wp_error( $schema ) ? $schema->get_error_message() : '' ) );",
          "$assert( ! is_wp_error( $schema ), 'Schema verification failed: ' . ( is_wp_error( $schema ) ? $schema->get_error_message() : '' ) );\n$assert( true === SPF_Installer::verify_required_indexes(), 'Required File 01 index integrity failed.' );", 'runtime indexes')
          p.write_text(s)
          PY

          php -l includes/class-spf-installer.php
          php -l includes/class-spf-event-bus.php
          php -l includes/class-spf-governance.php
          php -l qa/wp-runtime-smoke.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/class-spf-installer.php includes/class-spf-event-bus.php includes/class-spf-governance.php qa/wp-runtime-smoke.php
          git commit -m 'fix: close final central-plan event classification activation-gate and index-integrity gaps'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
