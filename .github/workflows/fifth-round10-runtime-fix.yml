name: File 01 Fifth Review Round 10 Runtime Fix

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .github/workflows/fifth-round10-runtime-fix.yml
      - tools/fifth-round10-runtime-fix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply Round 10 runtime correction
        run: python3 tools/fifth-round10-runtime-fix.py
      - name: Validate source QA
        run: bash qa/run-tests.sh
      - name: Commit corrected product source
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          git add includes/class-spf-platform-engineering.php SOURCE-CHECKSUMS.sha256
          git diff --cached --check
          git commit -m "Fifth review Round 10: fix normalized self-dependency guard"
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
