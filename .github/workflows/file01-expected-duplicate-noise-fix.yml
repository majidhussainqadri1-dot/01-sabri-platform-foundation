name: File 01 expected duplicate log-noise fix

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .file01-expected-duplicate-noise-fix.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - run: python3 tools/file01-expected-duplicate-noise-fix.py
      - run: |
          php -l includes/class-spf-idempotency.php
          php -l includes/class-spf-event-bus.php
          php -l tests/source-quality-tests.php
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/class-spf-idempotency.php includes/class-spf-event-bus.php tests/source-quality-tests.php
          git commit -m 'fix: suppress expected duplicate-insert noise without weakening concurrency checks'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
