name: File 01 Round 1 Patch

on:
  workflow_dispatch:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .file01-round1-fixes-v2.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/file01-round1-patch.py
      - name: Validate PHP
        run: |
          php -l includes/class-spf-installer.php
          php -l includes/class-spf-event-bus.php
          php -l includes/class-spf-governance.php
          php -l qa/wp-runtime-smoke.php
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/class-spf-installer.php includes/class-spf-event-bus.php includes/class-spf-governance.php qa/wp-runtime-smoke.php
          git commit -m 'fix: close final File 01 central-plan runtime gaps'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
