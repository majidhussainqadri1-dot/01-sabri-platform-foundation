name: Refresh File 01 Source Checksums

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .github/workflows/refresh-source-checksums.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Rebuild checksum manifest and commit if changed
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z \
            | while IFS= read -r -d '' file; do
                case "$file" in
                  SOURCE-CHECKSUMS.sha256|.github/workflows/refresh-source-checksums.yml|build/*|dist/*) continue ;;
                esac
                sha256sum "$file"
              done \
            | LC_ALL=C sort -k2 > SOURCE-CHECKSUMS.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- SOURCE-CHECKSUMS.sha256; then
            git add SOURCE-CHECKSUMS.sha256
            git commit -m 'chore: refresh File 01 v2 source checksums after warning correction'
            git push origin HEAD:codex/file-01-complete-foundation-1.0.0
          fi
