name: Temporary File 01 2.0.1 Manifest Refresh

on:
  push:
    branches:
      - fix/reconciliation-repair-ownership

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message || '', '[v2.0.1-manifest-refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Align current-release regressions, remove bootstrap workflow and regenerate exact-tree manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'tests/fresh-eighty-round-review-tests.php': [
              ('''$assert( str_contains($main, "define( 'SPF_VERSION', '2.0.0' )") && str_contains($main, "define( 'SPF_CONTRACT_VERSION', '2.0.0' )"), 'Round 80: runtime/version contract baseline drifted from File 01 v2.0.' );''',
               '''$assert( str_contains($main, "define( 'SPF_VERSION', '2.0.1' )") && str_contains($main, "define( 'SPF_SCHEMA_VERSION', '1.2.0' )") && str_contains($main, "define( 'SPF_CONTRACT_VERSION', '2.0.0' )"), 'Round 80: current software/schema/contract identity drifted from File 01 2.0.1 / 1.2.0 / 2.0.0.' );''')
            ],
            'tests/tenth-fresh-eighty-round-review-tests.php': [
              ('''66 => array('sabri-platform-foundation.php', "SPF_VERSION', '2.0.0", 'software version drifted from v2.0'),''',
               '''66 => array('sabri-platform-foundation.php', "SPF_VERSION', '2.0.1", 'software version drifted from v2.0.1'),''')
            ],
          }
          for path, pairs in replacements.items():
              p=Path(path); s=p.read_text()
              for old,new in pairs:
                  if old not in s:
                      raise SystemExit(f'Expected current-release assertion not found in {path}: {old}')
                  s=s.replace(old,new,1)
              p.write_text(s)
          PY
          rm .github/workflows/refresh-2.0.1-manifest.yml
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
          bash qa/run-tests.sh
          git diff --check
      - name: Commit exact-tree manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'release: finalize File 01 2.0.1 current-version evidence [v2.0.1-manifest-refreshed]'
          git push origin HEAD:fix/reconciliation-repair-ownership
