name: Apply File 01 Second Ten-Round Review

on:
  push:
    branches:
      - codex/file-01-second-ten-round-review-2026-08-08

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply ten sequential review/fix rounds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          regen_checksums() {
            git add -A
            : > SOURCE-CHECKSUMS.sha256
            while IFS= read -r -d '' f; do
              case "$f" in
                SOURCE-CHECKSUMS.sha256|build/*|dist/*) continue ;;
              esac
              if [ -f "$f" ]; then sha256sum "$f" >> SOURCE-CHECKSUMS.sha256; fi
            done < <(git ls-files -z)
            sort -k2 SOURCE-CHECKSUMS.sha256 -o SOURCE-CHECKSUMS.sha256
            git add SOURCE-CHECKSUMS.sha256
          }

          finish_round() {
            local message="$1"
            regen_checksums
            bash qa/run-tests.sh
            git add -A
            git commit -m "$message"
          }

          # ROUND 1 — Runtime architecture-linter manifest fidelity.
          python3 <<'PY'
          from pathlib import Path
          p=Path('includes/class-spf-registry.php')
          s=p.read_text()
          old="""\t\tif ( ! is_array( $manifest['health'] ) ) {\n\t\t\treturn new WP_Error( 'spf_invalid_manifest', 'Manifest health declaration must be structured.' );\n\t\t}\n\t\t$manifest['module_key'] = $module_key;"""
          new="""\t\tif ( ! is_array( $manifest['health'] ) ) {\n\t\t\treturn new WP_Error( 'spf_invalid_manifest', 'Manifest health declaration must be structured.' );\n\t\t}\n\t\tforeach ( array( 'canonical_entities', 'writes' ) as $architecture_field ) {\n\t\t\tif ( isset( $manifest[ $architecture_field ] ) && ! is_array( $manifest[ $architecture_field ] ) ) {\n\t\t\t\treturn new WP_Error( 'spf_invalid_manifest', 'Manifest architecture field must be an array: ' . $architecture_field );\n\t\t\t}\n\t\t}\n\t\t$canonical_entities = array();\n\t\tforeach ( array_slice( (array) ( $manifest['canonical_entities'] ?? array() ), 0, 128 ) as $entity ) {\n\t\t\t$key = sanitize_key( is_array( $entity ) ? ( $entity['key'] ?? '' ) : $entity );\n\t\t\tif ( $key ) { $canonical_entities[] = $key; }\n\t\t}\n\t\t$manifest['canonical_entities'] = array_values( array_unique( $canonical_entities ) );\n\t\t$writes = array();\n\t\tforeach ( array_slice( (array) ( $manifest['writes'] ?? array() ), 0, 128 ) as $write ) {\n\t\t\tif ( ! is_array( $write ) ) { continue; }\n\t\t\t$target = sanitize_key( $write['owner_module'] ?? '' );\n\t\t\tif ( ! preg_match( '/^file-(?:0[0-9]|1[0-9]|2[0-6])$/', $target ) ) {\n\t\t\t\treturn new WP_Error( 'spf_invalid_manifest_write_owner', __( 'Manifest write declarations require a canonical owner module.', 'sabri-platform-foundation' ) );\n\t\t\t}\n\t\t\t$writes[] = array(\n\t\t\t\t'owner_module' => $target,\n\t\t\t\t'operation'    => substr( sanitize_key( $write['operation'] ?? 'write' ), 0, 64 ),\n\t\t\t\t'purpose'      => substr( sanitize_text_field( $write['purpose'] ?? '' ), 0, 191 ),\n\t\t\t);\n\t\t}\n\t\t$manifest['writes'] = $writes;\n\t\t$manifest['global_shell_owner'] = ! empty( $manifest['global_shell_owner'] );\n\t\t$manifest['application_shell_owner'] = ! empty( $manifest['application_shell_owner'] );\n\t\t$manifest['module_key'] = $module_key;"""
          assert old in s
          s=s.replace(old,new,1)
          old2="""\t\t\t'events' => $manifest['events'] ?? array(), 'routes' => $manifest['routes'] ?? array(), 'data_classes' => $manifest['data_classes'] ?? array(),\n\t\t\t'health' => $manifest['health'] ?? array(), 'record_version' => (int) $row['record_version'], 'updated_at' => $row['updated_at'],"""
          new2="""\t\t\t'events' => $manifest['events'] ?? array(), 'routes' => $manifest['routes'] ?? array(), 'data_classes' => $manifest['data_classes'] ?? array(),\n\t\t\t'canonical_entities' => $manifest['canonical_entities'] ?? array(), 'writes' => $manifest['writes'] ?? array(),\n\t\t\t'global_shell_owner' => ! empty( $manifest['global_shell_owner'] ), 'application_shell_owner' => ! empty( $manifest['application_shell_owner'] ),\n\t\t\t'health' => $manifest['health'] ?? array(), 'record_version' => (int) $row['record_version'], 'updated_at' => $row['updated_at'],"""
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path('includes/class-spf-governance-control-plane.php')
          s=p.read_text()
          old="\t\t\t$manifest = (array) ( $module['manifest'] ?? array() );"
          new="\t\t\t$manifest = (array) ( $module['manifest'] ?? $module );"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/future-foundation-tests.php')
          s=p.read_text()
          marker="$trace=SPF_Governance_Control_Plane::build_traceability_report"
          insert="""$normalize_manifest=new ReflectionMethod(SPF_Registry::class,'normalize_manifest');$normalize_manifest->setAccessible(true);\n$architecture_manifest=$normalize_manifest->invoke(null,[\n 'module_key'=>'file-20','owner_file'=>'20','owner_name'=>'Shell','slug'=>'shell','namespace_prefix'=>'SHELL_','software_version'=>'1.0.0','contract_version'=>'1.0.0','state'=>'active',\n 'required'=>[],'optional'=>[],'capabilities'=>[],'commands'=>[],'queries'=>[],'events'=>[],'routes'=>[],'data_classes'=>[],'health'=>[],\n 'canonical_entities'=>['global-shell'],'writes'=>[['owner_module'=>'file-20','operation'=>'write']],'global_shell_owner'=>true,\n]);\n$assert(!is_wp_error($architecture_manifest)&&($architecture_manifest['canonical_entities'][0]??'')==='global-shell','Manifest architecture declarations were not preserved.');\n$assert(($architecture_manifest['global_shell_owner']??false)===true,'Shell-owner declaration was not preserved.');\n\n"""
          assert marker in s
          s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY
          finish_round 'Review 1: preserve runtime architecture manifest declarations'

          # ROUND 2 — Golden-path scaffolder must generate a registry-valid manifest.
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('includes/class-spf-platform-engineering.php'); s=p.read_text()
          old="""\t\tif ( '' === $module_key || '' === $owner_file || '' === $slug || '' === $prefix || strlen( $prefix ) > 16 ) {\n\t\t\treturn new WP_Error( 'spf_scaffold_invalid', __( 'Module key, owner file, slug and bounded namespace prefix are required.', 'sabri-platform-foundation' ), array( 'status' => 400 ) );\n\t\t}"""
          new="""\t\tif ( '' === $module_key || '' === $owner_file || '' === $slug || '' === $prefix || strlen( $prefix ) > 16\n\t\t\t|| ! preg_match( '/^file-(?:0[0-9]|1[0-9]|2[0-6])$/', $module_key )\n\t\t\t|| ! preg_match( '/^(?:0[0-9]|1[0-9]|2[0-6])$/', $owner_file )\n\t\t\t|| $module_key !== 'file-' . $owner_file ) {\n\t\t\treturn new WP_Error( 'spf_scaffold_invalid', __( 'A currently approved canonical module key, matching owner file, slug and bounded namespace prefix are required.', 'sabri-platform-foundation' ), array( 'status' => 400 ) );\n\t\t}"""
          assert old in s; s=s.replace(old,new,1)
          old2="""\t\t\t'commands'         => array(),\n\t\t\t'queries'          => array(),\n\t\t\t'events'           => array(),\n\t\t\t'privacy_classes'  => array( 'internal' ),"""
          new2="""\t\t\t'capabilities'     => array(),\n\t\t\t'commands'         => array(),\n\t\t\t'queries'          => array(),\n\t\t\t'events'           => array(),\n\t\t\t'routes'           => array(),\n\t\t\t'data_classes'     => array( 'internal' ),\n\t\t\t'health'           => array( 'callback' => '', 'contract' => '' ),\n\t\t\t'canonical_entities'=> array(),\n\t\t\t'writes'           => array(),\n\t\t\t'global_shell_owner'=> false,\n\t\t\t'application_shell_owner'=> false,"""
          assert old2 in s; s=s.replace(old2,new2,1)
          pattern=r"\n\tprivate static function normalize_scaffold_dependencies\( array \$dependencies \) \{.*?\n\t\}\n\n\tprivate static function sanitize_numeric_map"
          repl="""
\tprivate static function normalize_scaffold_dependencies( array $dependencies ) {
\t\t$out = array();
\t\t$seen = array();
\t\tforeach ( array_slice( $dependencies, 0, 100 ) as $dependency ) {
\t\t\tif ( is_array( $dependency ) ) {
\t\t\t\t$key = sanitize_key( $dependency['module_key'] ?? '' );
\t\t\t\t$minimum = sanitize_text_field( $dependency['minimum_version'] ?? '0.0.0' );
\t\t\t\t$maximum = sanitize_text_field( $dependency['maximum_version'] ?? '' );
\t\t\t} else {
\t\t\t\t$key = sanitize_key( $dependency );
\t\t\t\t$minimum = '0.0.0';
\t\t\t\t$maximum = '';
\t\t\t}
\t\t\tif ( ! preg_match( '/^file-(?:0[0-9]|1[0-9]|2[0-6])$/', $key ) || ! SPF_Registry::valid_semver( $minimum )
\t\t\t\t|| ( $maximum && ! SPF_Registry::valid_semver( $maximum ) ) || ( $maximum && version_compare( $minimum, $maximum, '>' ) ) ) {
\t\t\t\treturn new WP_Error( 'spf_scaffold_dependency_invalid', __( 'Generated module dependencies require a canonical module key and valid semantic version range.', 'sabri-platform-foundation' ), array( 'status'=>400 ) );
\t\t\t}
\t\t\tif ( isset( $seen[ $key ] ) ) { continue; }
\t\t\t$seen[ $key ] = true;
\t\t\t$out[] = array( 'module_key'=>$key, 'minimum_version'=>$minimum, 'maximum_version'=>$maximum );
\t\t}
\t\treturn $out;
\t}

\tprivate static function sanitize_numeric_map"""
          s2,n=re.subn(pattern,repl,s,flags=re.S); assert n==1; p.write_text(s2)

          p=Path('tests/future-foundation-tests.php'); s=p.read_text()
          s=s.replace("['module_key'=>'file-27','owner_file'=>'27','owner_name'=>'Example Module'","['module_key'=>'file-26','owner_file'=>'26','owner_name'=>'Example Module'",1)
          marker="$assert(($scaffold['manifest']['required'][0]['minimum_version']??'')==='2.0.0','Scaffolder lost minimum dependency version.');"
          add="""$assert(isset($scaffold['manifest']['capabilities'],$scaffold['manifest']['routes'],$scaffold['manifest']['data_classes'],$scaffold['manifest']['health']),'Generated manifest is missing registry-required fields.');\n$generated_manifest_check=$normalize_manifest->invoke(null,$scaffold['manifest']);\n$assert(!is_wp_error($generated_manifest_check),'Golden-path scaffold is not accepted by the File 01 manifest contract.');\n"""
          assert marker in s; s=s.replace(marker,marker+'\n'+add,1); p.write_text(s)
          PY
          finish_round 'Review 2: make golden-path scaffolds registry-valid and canonically numbered'

          # ROUND 3 — Developer service catalog and File 01 v2 capability declaration.
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('includes/class-spf-platform-engineering.php'); s=p.read_text()
          pattern=r"\tpublic static function service_catalog\(\) \{.*?\n\t\}\n\n\tpublic static function scaffold_module"
          repl="""\tpublic static function service_catalog() {
\t\t$modules = SPF_Registry::list_modules( array( 'limit' => 200 ) );
\t\t$contracts = SPF_Registry::list_contracts( array( 'limit' => 200 ) );
\t\t$routes = SPF_Registry::list_routes();
\t\t$readiness = SPF_Dependency_Resolver::all_readiness();
\t\t$readiness_by_key = array();
\t\tforeach ( $readiness as $item ) {
\t\t\tif ( is_array( $item ) && ! empty( $item['module_key'] ) ) {
\t\t\t\t$readiness_by_key[ sanitize_key( $item['module_key'] ) ] = $item;
\t\t\t}
\t\t}
\t\t$catalog = array();
\t\tforeach ( $modules as $module ) {
\t\t\tif ( ! is_array( $module ) ) { continue; }
\t\t\t$key = sanitize_key( $module['module_key'] ?? '' );
\t\t\t$catalog[] = array(
\t\t\t\t'module_key'       => $key,
\t\t\t\t'owner_file'       => sanitize_text_field( $module['owner_file'] ?? '' ),
\t\t\t\t'owner_name'       => sanitize_text_field( $module['owner_name'] ?? '' ),
\t\t\t\t'software_version' => sanitize_text_field( $module['software_version'] ?? '' ),
\t\t\t\t'contract_version' => sanitize_text_field( $module['contract_version'] ?? '' ),
\t\t\t\t'state'            => sanitize_key( $module['state'] ?? '' ),
\t\t\t\t'capabilities'     => array_values( (array) ( $module['capabilities'] ?? array() ) ),
\t\t\t\t'required'         => array_values( (array) ( $module['required'] ?? array() ) ),
\t\t\t\t'optional'         => array_values( (array) ( $module['optional'] ?? array() ) ),
\t\t\t\t'canonical_entities'=> array_values( (array) ( $module['canonical_entities'] ?? array() ) ),
\t\t\t\t'readiness'        => $readiness_by_key[ $key ] ?? array( 'ready'=>false, 'code'=>'not_evaluated' ),
\t\t\t);
\t\t}
\t\t$contract_catalog = array();
\t\tforeach ( $contracts as $contract ) {
\t\t\tif ( ! is_array( $contract ) ) { continue; }
\t\t\t$contract_catalog[] = array(
\t\t\t\t'contract_key'=>sanitize_text_field( $contract['contract_key'] ?? '' ),
\t\t\t\t'contract_version'=>sanitize_text_field( $contract['contract_version'] ?? '' ),
\t\t\t\t'owner_module'=>sanitize_key( $contract['owner_module'] ?? '' ),
\t\t\t\t'status'=>sanitize_key( $contract['status'] ?? '' ),
\t\t\t\t'consumers'=>array_values( (array) ( $contract['consumers'] ?? array() ) ),
\t\t\t\t'deprecation_at'=>sanitize_text_field( $contract['deprecation_at'] ?? '' ),
\t\t\t);
\t\t}
\t\t$route_catalog = array();
\t\tforeach ( $routes as $route ) {
\t\t\tif ( ! is_array( $route ) ) { continue; }
\t\t\t$route_catalog[] = array(
\t\t\t\t'route_key'=>sanitize_key( $route['route_key'] ?? '' ),
\t\t\t\t'route_path'=>sanitize_text_field( $route['route_path'] ?? '' ),
\t\t\t\t'owner_module'=>sanitize_key( $route['owner_module'] ?? '' ),
\t\t\t\t'layout_context'=>sanitize_key( $route['layout_context'] ?? '' ),
\t\t\t\t'status'=>sanitize_key( $route['status'] ?? '' ),
\t\t\t);
\t\t}
\t\treturn array(
\t\t\t'generated_at'  => SPF_Runtime::now_mysql(),
\t\t\t'modules'       => $catalog,
\t\t\t'contracts'     => $contract_catalog,
\t\t\t'routes'        => $route_catalog,
\t\t\t'contract_count'=> count( $contract_catalog ),
\t\t\t'route_count'   => count( $route_catalog ),
\t\t\t'health'        => SPF_System_Check::latest(),
\t\t\t'ownership_note'=> 'Catalog only. Canonical domain ownership remains with each numbered file.',
\t\t);
\t}

\tpublic static function scaffold_module"""
          s2,n=re.subn(pattern,repl,s,flags=re.S); assert n==1; p.write_text(s2)

          p=Path('includes/class-spf-installer.php'); s=p.read_text()
          old="""\t\t\t'capabilities'     => array( 'registry', 'contracts', 'foundational_routes', 'dependency_readiness', 'system_check', 'release_evidence', 'legacy_reconciliation', 'safe_repair', 'privacy_lifecycle', 'event_backbone', 'feature_flags' ),"""
          new="""\t\t\t'capabilities'     => array( 'registry', 'contracts', 'foundational_routes', 'dependency_readiness', 'system_check', 'release_evidence', 'legacy_reconciliation', 'safe_repair', 'privacy_lifecycle', 'event_backbone', 'feature_flags', 'policy_as_code', 'amendment_impact_simulation', 'architecture_lint', 'spec_code_traceability', 'developer_service_catalog', 'golden_path_scaffolder', 'contract_compatibility_lab', 'event_schema_registry', 'config_drift_detection', 'release_train_planning', 'progressive_delivery', 'slo_error_budget_gate', 'platform_digital_twin', 'bounded_self_heal', 'chaos_harness', 'telemetry_context', 'governance_snapshots', 'ai_governance_advisory' ),"""
          assert old in s; s=s.replace(old,new,1); p.write_text(s)

          p=Path('tests/future-foundation-tests.php'); s=p.read_text()
          marker="$assert(str_contains($eng_source,\"'future-event-schema-registry'\") && str_contains($eng_source,\"'future-config-baselines'\"),'Future registries lack concurrency locks.');"
          add="""$assert(str_contains($eng_source,"'contracts'     => $contract_catalog") && str_contains($eng_source,"'routes'        => $route_catalog"),'Developer service catalog omits contract/route summaries.');\n$installer_source=file_get_contents(dirname(__DIR__).'/includes/class-spf-installer.php');\n$assert(str_contains($installer_source,"'policy_as_code'")&&str_contains($installer_source,"'ai_governance_advisory'"),'File 01 v2 manifest omits Future Foundation capabilities.');\n"""
          assert marker in s; s=s.replace(marker,marker+'\n'+add,1); p.write_text(s)
          PY
          finish_round 'Review 3: complete developer service catalog and v2 capability declaration'

          # ROUND 4 — Release-train canonical/version-range validation.
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('includes/class-spf-platform-engineering.php'); s=p.read_text()
          pattern=r"\tpublic static function plan_release_train\( array \$manifests \) \{.*?\n\t\}\n\n\tpublic static function create_rollout"
          repl="""\tpublic static function plan_release_train( array $manifests ) {
\t\t$versions = array();
\t\t$dependencies = array();
\t\t$ranges = array();
\t\t$manifest_errors = array();
\t\t$seen = array();
\t\tforeach ( $manifests as $index => $manifest ) {
\t\t\tif ( ! is_array( $manifest ) ) { $manifest_errors[] = array( 'index'=>$index, 'code'=>'manifest_not_object' ); continue; }
\t\t\t$key = sanitize_key( $manifest['module_key'] ?? '' );
\t\t\tif ( ! preg_match( '/^file-(?:0[0-9]|1[0-9]|2[0-6])$/', $key ) ) { $manifest_errors[] = array( 'index'=>$index, 'code'=>'module_key_invalid', 'value'=>$key ); continue; }
\t\t\tif ( isset( $seen[ $key ] ) ) { $manifest_errors[] = array( 'module_key'=>$key, 'code'=>'duplicate_module_key' ); continue; }
\t\t\t$seen[ $key ] = true;
\t\t\t$version = sanitize_text_field( $manifest['software_version'] ?? '' );
\t\t\tif ( ! SPF_Registry::valid_semver( $version ) ) { $manifest_errors[] = array( 'module_key'=>$key, 'code'=>'software_version_invalid', 'value'=>$version ); }
\t\t\t$versions[ $key ] = $version;
\t\t\t$dependencies[ $key ] = array();
\t\t\t$ranges[ $key ] = array();
\t\t\tforeach ( (array) ( $manifest['required'] ?? array() ) as $dependency ) {
\t\t\t\tif ( is_array( $dependency ) ) {
\t\t\t\t\t$dep_key = sanitize_key( $dependency['module_key'] ?? '' );
\t\t\t\t\t$minimum = sanitize_text_field( $dependency['minimum_version'] ?? '0.0.0' );
\t\t\t\t\t$maximum = sanitize_text_field( $dependency['maximum_version'] ?? '' );
\t\t\t\t} else {
\t\t\t\t\t$dep_key = sanitize_key( $dependency ); $minimum = '0.0.0'; $maximum = '';
\t\t\t\t}
\t\t\t\tif ( ! preg_match( '/^file-(?:0[0-9]|1[0-9]|2[0-6])$/', $dep_key ) ) { $manifest_errors[] = array( 'module_key'=>$key, 'code'=>'dependency_key_invalid', 'value'=>$dep_key ); continue; }
\t\t\t\tif ( $dep_key === $key ) { $manifest_errors[] = array( 'module_key'=>$key, 'dependency'=>$dep_key, 'code'=>'self_dependency' ); }
\t\t\t\tif ( ! SPF_Registry::valid_semver( $minimum ) || ( $maximum && ! SPF_Registry::valid_semver( $maximum ) ) || ( $maximum && version_compare( $minimum, $maximum, '>' ) ) ) {
\t\t\t\t\t$manifest_errors[] = array( 'module_key'=>$key, 'dependency'=>$dep_key, 'code'=>'dependency_version_range_invalid', 'minimum'=>$minimum, 'maximum'=>$maximum ); continue;
\t\t\t\t}
\t\t\t\tif ( isset( $ranges[ $key ][ $dep_key ] ) && $ranges[ $key ][ $dep_key ] !== array( 'minimum'=>$minimum, 'maximum'=>$maximum ) ) {
\t\t\t\t\t$manifest_errors[] = array( 'module_key'=>$key, 'dependency'=>$dep_key, 'code'=>'dependency_version_conflict' ); continue;
\t\t\t\t}
\t\t\t\t$dependencies[ $key ][ $dep_key ] = $minimum;
\t\t\t\t$ranges[ $key ][ $dep_key ] = array( 'minimum'=>$minimum, 'maximum'=>$maximum );
\t\t\t}
\t\t}
\t\t$in_degree = array_fill_keys( array_keys( $dependencies ), 0 );
\t\t$edges = array_fill_keys( array_keys( $dependencies ), array() );
\t\t$missing = array(); $incompatible = array();
\t\tforeach ( $dependencies as $module => $deps ) {
\t\t\tforeach ( $deps as $dep => $minimum ) {
\t\t\t\tif ( ! isset( $dependencies[ $dep ] ) ) { $missing[ $module ][] = $dep; continue; }
\t\t\t\t$maximum = $ranges[ $module ][ $dep ]['maximum'] ?? '';
\t\t\t\t$actual = $versions[ $dep ] ?? '';
\t\t\t\tif ( SPF_Registry::valid_semver( $actual ) && ( ( '0.0.0' !== $minimum && version_compare( $actual, $minimum, '<' ) ) || ( $maximum && version_compare( $actual, $maximum, '>' ) ) ) ) {
\t\t\t\t\t$incompatible[ $module ][] = array( 'module_key'=>$dep, 'minimum_version'=>$minimum, 'maximum_version'=>$maximum, 'actual_version'=>$actual );
\t\t\t\t}
\t\t\t\t$edges[ $dep ][] = $module; $in_degree[ $module ]++;
\t\t\t}
\t\t}
\t\t$queue = array_keys( array_filter( $in_degree, static function ( $degree ) { return 0 === $degree; } ) ); sort( $queue, SORT_STRING );
\t\t$order = array();
\t\twhile ( $queue ) { $node=array_shift($queue); $order[]=$node; foreach($edges[$node] as $consumer){$in_degree[$consumer]--;if(0===$in_degree[$consumer]){$queue[]=$consumer;sort($queue,SORT_STRING);}} }
\t\t$cycles = array_keys( array_filter( $in_degree, static function ( $degree ) { return $degree > 0; } ) );
\t\treturn array(
\t\t\t'valid'=>empty($manifest_errors)&&empty($missing)&&empty($incompatible)&&empty($cycles), 'order'=>$order,
\t\t\t'manifest_errors'=>$manifest_errors, 'missing'=>$missing, 'incompatible'=>$incompatible, 'cycle_candidates'=>$cycles,
\t\t\t'plan_hash'=>SPF_Runtime::hash(array('versions'=>$versions,'dependencies'=>$ranges,'order'=>$order,'errors'=>$manifest_errors,'missing'=>$missing,'incompatible'=>$incompatible)),
\t\t\t'execution_mode'=>'plan-only-until-approved-deployment-adapter',
\t\t);
\t}

\tpublic static function create_rollout"""
