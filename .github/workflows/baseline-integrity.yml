name: Baseline Integrity

on:
  push:
    branches:
      - baseline/file-01-original-import
  pull_request:

permissions:
  contents: read

concurrency:
  group: file-01-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Source checksums and PHP syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify exact imported source checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check CHECKSUMS.sha256

      - name: Lint imported PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
