name: Apply File 01 forty-round source

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .codex/review40.chunk07
      - .codex/review40.trigger

permissions:
  contents: write

concurrency:
  group: file01-review40-source-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Verify and apply reviewed source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .codex/review40.chunk{00..07}
          cat .codex/review40.chunk{00..07} | base64 -d > /tmp/file01-review40.tar.gz
          sha256sum /tmp/file01-review40.tar.gz
          echo '2f1db0b1c09920d821ee518666cbd27c7e8666eb541898d9ebb6198d3c73447d  /tmp/file01-review40.tar.gz' | sha256sum --check -
          tar -xzf /tmp/file01-review40.tar.gz -C .
          rm -rf .codex
          rm -f .github/workflows/apply-forty-round-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply File 01 forty-round reviewed source 1.1.1'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
