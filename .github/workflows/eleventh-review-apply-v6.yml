name: File 01 Eleventh Review Apply v6
on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply source corrections
        run: python tools/eleventh-review-apply.py
      - name: Finalize lifecycle QA
        run: python tools/eleventh-review-finalize.py
      - name: Fix meta-regression QA
        run: python tools/eleventh-review-finalize-v2.py
      - name: Integrate runtime regressions
        run: python tools/eleventh-review-finalize-v3.py
      - name: Restore immutable corrective workflow
        run: git checkout HEAD -- .github/workflows/corrective-qa.yml
      - name: Remove temporary non-workflow scripts
        run: rm -f tools/eleventh-review-apply.py tools/eleventh-review-finalize.py tools/eleventh-review-finalize-v2.py tools/eleventh-review-finalize-v3.py
      - name: Regenerate source checksums
        run: find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
      - name: Run source QA
        run: bash qa/run-tests.sh
      - name: Commit non-workflow corrected source
        run: |
          git config user.name 'File 01 Corrective QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git commit -m 'fix: eleventh ten-round File 01 corrective review'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
