name: Apply File 01 Second Ten-Round Review

on:
  push:
    branches:
      - codex/file-01-second-ten-round-review-2026-08-08
    paths:
      - .second-ten-round.ready

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout review transport branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Capture runner and checkout current File 01 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp tools/apply-second-ten-round-review.py /tmp/apply-second-ten-round-review.py
          git fetch origin codex/file-01-complete-foundation-1.0.0
          git checkout -B second-review-work origin/codex/file-01-complete-foundation-1.0.0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Execute ten sequential review-fix-regression rounds
        run: python3 /tmp/apply-second-ten-round-review.py

      - name: Advance canonical File 01 PR branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
