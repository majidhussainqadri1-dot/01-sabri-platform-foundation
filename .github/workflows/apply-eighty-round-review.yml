name: Apply 80 Round Review Payload

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - '.github/workflows/apply-eighty-round-review.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out corrective branch and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Verify original immutable gzip payload
        shell: bash
        run: |
          set -euo pipefail
          git show 57ef1b9de588c253a35feb1ad33ccd26bcdba318:tools/eighty-round-corrective.patch.gz.b64 > /tmp/eighty-review.b64
          tr -d '\r\n\t ' < /tmp/eighty-review.b64 > /tmp/eighty-review.clean.b64
          base64 --decode /tmp/eighty-review.clean.b64 > /tmp/eighty-review.patch.gz
          gzip -t /tmp/eighty-review.patch.gz
          gzip -dc /tmp/eighty-review.patch.gz > /tmp/eighty-review.patch
          test -s /tmp/eighty-review.patch
          grep -q 'EIGHTY-ROUND-REVIEW-2026-08-09.md' /tmp/eighty-review.patch
          grep -q 'eighty-round-review-tests.php' /tmp/eighty-review.patch
          git apply --check /tmp/eighty-review.patch
          echo 'Original 80-round payload Base64 + GZip CRC + git dry-run PASS'
      - name: Apply corrective payload
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/eighty-review.patch
          test -f EIGHTY-ROUND-REVIEW-2026-08-09.md
          test -f tests/eighty-round-review-tests.php
          grep -q 'eighty-round-review-tests.php' qa/run-tests.sh
          php -l tests/eighty-round-review-tests.php
          echo '80-round corrective payload applied'
      - name: Remove all staging artifacts and refresh checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/eighty-round-bzparts
          rm -f tools/eighty-round-corrective.patch.gz.b64
          rm -f .github/workflows/apply-eighty-round-review.yml
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
      - name: Run full source regression
        shell: bash
        run: |
          set -euo pipefail
          bash qa/run-tests.sh
      - name: Commit clean corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete 80-round File 01 corrective review and fixes'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
