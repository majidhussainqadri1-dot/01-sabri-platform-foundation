name: Align File 01 Runtime Smoke With Hardened Authorization

on:
  push:
    branches:
      - codex/file-01-runtime-smoke-fix
    paths:
      - .review-runtime-smoke.ready

permissions:
  contents: write

jobs:
  align-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none

      - name: Align runtime smoke with Founder/release-operator boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          smoke = Path('qa/wp-future-foundation-smoke.php')
          text = smoke.read_text()

          old_policy = """$saved_policy = SPF_Governance_Control_Plane::save_policy( array( 'id'=>'F01-POL-SMOKE-001','title'=>'Smoke deny rule','effect'=>'deny','actions'=>array('smoke_forbidden_action'),'owner'=>'file-01','decision_id'=>'F01-FUT-001','priority'=>50 ) );
          $assert( ! is_wp_error( $saved_policy ) && 'F01-POL-SMOKE-001' === $saved_policy['id'], 'Policy-as-Code write path failed.' );"""
          new_policy = """$policies_before_denied_write = get_option( SPF_Governance_Control_Plane::POLICY_OPTION, array() );
          $saved_policy = SPF_Governance_Control_Plane::save_policy( array( 'id'=>'F01-POL-SMOKE-001','title'=>'Smoke deny rule','effect'=>'deny','actions'=>array('smoke_forbidden_action'),'owner'=>'file-01','decision_id'=>'F01-FUT-001','priority'=>50 ) );
          $assert( is_wp_error( $saved_policy ) && 'spf_forbidden' === $saved_policy->get_error_code(), 'Policy-as-Code mutation must fail closed without Founder amendment authority.' );
          $assert( SPF_Runtime::hash( get_option( SPF_Governance_Control_Plane::POLICY_OPTION, array() ) ) === SPF_Runtime::hash( $policies_before_denied_write ), 'Denied Policy-as-Code mutation changed the policy catalog.' );"""
          if old_policy not in text:
              raise SystemExit('expected policy smoke block not found')
          text = text.replace(old_policy, new_policy, 1)

          old_chaos = """$chaos = SPF_Resilience_Lab::run_chaos( 'dependency_timeout', array( 'module'=>'file-20' ) );
          $assert( ! is_wp_error( $chaos ) && empty( $chaos['injected'] ), 'Chaos must remain simulation-only without SPF_CHAOS_MODE.' );"""
          new_chaos = """$chaos_log_before_denied_run = get_option( SPF_Resilience_Lab::CHAOS_OPTION, array() );
          $chaos = SPF_Resilience_Lab::run_chaos( 'dependency_timeout', array( 'module'=>'file-20' ) );
          $assert( is_wp_error( $chaos ) && 'spf_forbidden' === $chaos->get_error_code(), 'Chaos must fail closed without release-operator reconciliation authority.' );
          $assert( SPF_Runtime::hash( get_option( SPF_Resilience_Lab::CHAOS_OPTION, array() ) ) === SPF_Runtime::hash( $chaos_log_before_denied_run ), 'Denied chaos execution changed the chaos evidence log.' );"""
          if old_chaos not in text:
              raise SystemExit('expected chaos smoke block not found')
          text = text.replace(old_chaos, new_chaos, 1)
          smoke.write_text(text)

          review = Path('TEN-ROUND-REVIEW-2026-08-08.md')
          r = review.read_text()
          old_row = "| 10 | Fresh concurrency/adversarial regression | F01-R10-D017 shared policy/event/config/snapshot registries still had read-modify-write lost-update windows. QA-T001: one new static assertion was initially over-specific about a literal variable representation | Registry-specific locks added to close lost-update windows; the over-specific QA assertion was corrected to test the actual invariant. Full focused suite then passed |"
          new_row = "| 10 | Fresh concurrency/adversarial regression | F01-R10-D017 shared policy/event/config/snapshot registries still had read-modify-write lost-update windows. QA-T001: one new static assertion was initially over-specific about a literal variable representation. QA-T002/QA-T003: exact-head WordPress smoke still expected ordinary administrator success for newly Founder-only policy mutation and release-operator-only chaos execution | Registry-specific locks added to close lost-update windows; the over-specific static assertion was corrected; runtime smoke was realigned to require fail-closed denial with zero side effects for privileged operations. Focused and runtime regressions were rerun |"
          if old_row not in r:
              raise SystemExit('expected round-10 review row not found')
          r = r.replace(old_row, new_row, 1)
          marker = "\n## Exact-head runtime regression correction\n\nThe first exact-head WordPress/MySQL run after the ten-round source correction correctly exposed two stale QA expectations rather than a relaxation of the hardened authorization model. The smoke suite was corrected to assert `spf_forbidden` plus zero mutation for Founder-only Policy-as-Code changes and release-operator-only chaos execution. This correction is part of Round 10 QA closure and must be green before packaging.\n"
          if '## Exact-head runtime regression correction' not in r:
              r += marker
          review.write_text(r)
          PY

      - name: Remove one-shot transport and refresh exact source checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .review-runtime-smoke.ready .github/workflows/apply-runtime-smoke-alignment.yml
          git add qa/wp-future-foundation-smoke.php TEN-ROUND-REVIEW-2026-08-08.md
          : > SOURCE-CHECKSUMS.sha256
          while IFS= read -r -d '' file; do
            [ "$file" = "SOURCE-CHECKSUMS.sha256" ] && continue
            [ -f "$file" ] || continue
            printf '%s  %s\n' "$(sha256sum "$file" | awk '{print $1}')" "$file"
          done < <(git ls-files -z) | LC_ALL=C sort -k2 > SOURCE-CHECKSUMS.sha256
          git add SOURCE-CHECKSUMS.sha256

      - name: Run corrected source QA
        run: bash qa/run-tests.sh

      - name: Commit exact corrected tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align File 01 runtime smoke with hardened authorization'

      - name: Advance canonical File 01 PR branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
