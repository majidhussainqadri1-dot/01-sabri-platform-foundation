name: Apply File 01 Fourth Review

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, 'BEGIN-FOURTH-REVIEW-RUNNER') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Apply reviewed fixes, verify, and push
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-fourth-review.py
          git rm .github/workflows/apply-fourth-ten-round-review.yml tools/apply-fourth-review.py
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find . -type f -name '*.php' -not -path './build/*' -not -path './dist/*' -print0)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          manifest = Path('SOURCE-CHECKSUMS.sha256')
          paths = []
          for line in manifest.read_text().splitlines():
              if not line.strip():
                  continue
              _, path = line.split(None, 1)
              paths.append(path.strip())
          for extra in ['FOURTH-TEN-ROUND-REVIEW-2026-08-08.md', 'tests/fourth-ten-round-review-tests.php']:
              if extra not in paths:
                  paths.append(extra)
          out = []
          for path in paths:
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f'missing checksum path: {path}')
              out.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {path}")
          manifest.write_text('\n'.join(out) + '\n')
          PY
          bash qa/run-tests.sh
          bash tools/build-package.sh
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'Complete fourth fresh ten-round review with fail-closed fixes'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
