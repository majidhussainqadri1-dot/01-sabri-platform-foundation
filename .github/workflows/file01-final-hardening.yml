name: File 01 final plan hardening patch

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .file01-final-hardening.trigger

permissions:
  contents: write

concurrency:
  group: file01-final-plan-hardening
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0

      - name: Apply bounded registry and owner-reconciliation hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'non-unique patch anchor: {label}: {text.count(old)}')
              return text.replace(old, new, 1)

          p = Path('includes/class-spf-registry.php')
          s = p.read_text()
          s = replace_once(s,
          "\tpublic static function list_routes() {\n\t\tglobal $wpdb;\n\t\t$rows = $wpdb->get_results( 'SELECT * FROM ' . SPF_Installer::table( 'routes' ) . ' ORDER BY route_path', ARRAY_A );\n\t\treturn array_map( array( __CLASS__, 'route_dto' ), $rows );\n\t}\n",
          "\tpublic static function list_routes() {\n\t\tglobal $wpdb;\n\t\t$rows = $wpdb->get_results( $wpdb->prepare( 'SELECT * FROM ' . SPF_Installer::table( 'routes' ) . ' ORDER BY route_path LIMIT %d', 200 ), ARRAY_A );\n\t\treturn array_map( array( __CLASS__, 'route_dto' ), $rows );\n\t}\n", 'bounded list_routes')
          s = replace_once(s,
          "\t\t$manifest['optional'] = self::normalize_dependencies( $manifest['optional'] );\n\t\tif ( is_wp_error( $manifest['optional'] ) ) {\n\t\t\treturn $manifest['optional'];\n\t\t}\n\t\tforeach ( array( 'capabilities','commands','queries','events','routes','data_classes' ) as $field ) {\n\t\t\t$manifest[ $field ] = array_values( array_unique( array_filter( array_map( static function ( $v ) { return substr( sanitize_text_field( (string) $v ), 0, 191 ); }, $manifest[ $field ] ) ) ) );\n\t\t}\n",
          "\t\t$manifest['optional'] = self::normalize_dependencies( $manifest['optional'] );\n\t\tif ( is_wp_error( $manifest['optional'] ) ) {\n\t\t\treturn $manifest['optional'];\n\t\t}\n\t\t$required_keys = array_column( $manifest['required'], 'module_key' );\n\t\t$optional_keys = array_column( $manifest['optional'], 'module_key' );\n\t\tif ( array_intersect( $required_keys, $optional_keys ) ) {\n\t\t\treturn new WP_Error( 'spf_dependency_ambiguity', __( 'A module cannot be both a required and optional dependency.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\tforeach ( array( 'capabilities','commands','queries','events','routes','data_classes' ) as $field ) {\n\t\t\tif ( count( $manifest[ $field ] ) > 256 ) {\n\t\t\t\treturn new WP_Error( 'spf_manifest_collection_too_large', sprintf( __( 'Manifest collection is too large: %s', 'sabri-platform-foundation' ), $field ) );\n\t\t\t}\n\t\t\t$manifest[ $field ] = array_values( array_unique( array_filter( array_map( static function ( $v ) { return substr( sanitize_text_field( (string) $v ), 0, 191 ); }, $manifest[ $field ] ) ) ) );\n\t\t}\n", 'cross-list dependencies')
          s = replace_once(s,
          "\tprivate static function normalize_dependencies( array $dependencies ) {\n\t\t$result = array();\n\t\tforeach ( $dependencies as $dependency ) {\n",
          "\tprivate static function normalize_dependencies( array $dependencies ) {\n\t\tif ( count( $dependencies ) > 64 ) {\n\t\t\treturn new WP_Error( 'spf_dependency_list_too_large', __( 'A module dependency list exceeds the bounded limit.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\t$result = array();\n\t\t$seen = array();\n\t\tforeach ( $dependencies as $dependency ) {\n", 'dependency count')
          s = replace_once(s,
          "\t\t\tif ( ! preg_match( '/^file-(?:0[0-9]|1[0-9]|2[0-6])$/', $key ) || ! self::valid_semver( $min ) || ( $max && ! self::valid_semver( $max ) ) || ( $max && version_compare( $min, $max, '>' ) ) ) {\n\t\t\t\treturn new WP_Error( 'spf_invalid_dependency', __( 'Dependency version range is invalid.', 'sabri-platform-foundation' ) );\n\t\t\t}\n\t\t\t$result[] = array( 'module_key' => $key, 'minimum_version' => $min, 'maximum_version' => $max, 'purpose' => substr( sanitize_text_field( $dependency['purpose'] ?? '' ), 0, 191 ) );\n",
          "\t\t\tif ( ! preg_match( '/^file-(?:0[0-9]|1[0-9]|2[0-6])$/', $key ) || ! self::valid_semver( $min ) || ( $max && ! self::valid_semver( $max ) ) || ( $max && version_compare( $min, $max, '>' ) ) ) {\n\t\t\t\treturn new WP_Error( 'spf_invalid_dependency', __( 'Dependency version range is invalid.', 'sabri-platform-foundation' ) );\n\t\t\t}\n\t\t\tif ( isset( $seen[ $key ] ) ) {\n\t\t\t\treturn new WP_Error( 'spf_duplicate_dependency', __( 'A dependency module may be declared only once in a dependency list.', 'sabri-platform-foundation' ) );\n\t\t\t}\n\t\t\t$seen[ $key ] = true;\n\t\t\t$result[] = array( 'module_key' => $key, 'minimum_version' => $min, 'maximum_version' => $max, 'purpose' => substr( sanitize_text_field( $dependency['purpose'] ?? '' ), 0, 191 ) );\n", 'dependency uniqueness')
          s = replace_once(s,
          "\t\t$consumers = array_values( array_unique( array_filter( array_map( 'sanitize_key', $contract['consumers'] ) ) ) );\n\t\tforeach ( $consumers as $consumer ) {\n",
          "\t\t$consumers = array_values( array_unique( array_filter( array_map( 'sanitize_key', $contract['consumers'] ) ) ) );\n\t\t$schema_json = SPF_Runtime::canonical_json( $contract['schema'] );\n\t\tif ( count( $consumers ) > 64 || count( $contract['schema'] ) > 256 || false === $schema_json || strlen( $schema_json ) > 262144 ) {\n\t\t\treturn new WP_Error( 'spf_contract_too_large', __( 'Contract schema or consumer list exceeds the bounded contract envelope.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\tforeach ( $consumers as $consumer ) {\n", 'contract bounds')
          s = replace_once(s,
          "\t\t$redirects = array();\n\t\tforeach ( (array) ( $route['redirects'] ?? array() ) as $redirect ) {\n",
          "\t\t$raw_redirects = (array) ( $route['redirects'] ?? array() );\n\t\tif ( count( $raw_redirects ) > 64 ) {\n\t\t\treturn new WP_Error( 'spf_route_redirects_too_large', __( 'A route redirect declaration exceeds the bounded limit.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\t$redirects = array();\n\t\tforeach ( $raw_redirects as $redirect ) {\n", 'redirect bounds')
          p.write_text(s)

          p = Path('includes/class-spf-reconciler.php')
          s = p.read_text()
          s = replace_once(s,
          "\t\t\t\tif ( ! is_array( $owner_plan ) || empty( $owner_plan['accepted'] ) || empty( $owner_plan['owner_module'] ) || empty( $owner_plan['command_version'] ) ) {\n\t\t\t\t\t$blockers[] = array( 'code'=>'owner_reconciliation_adapter_missing','legacy_key'=>sanitize_key($key),'page_id'=>$page_id );\n\t\t\t\t}\n",
          "\t\t\t\t$owner_module = is_array( $owner_plan ) ? sanitize_key( $owner_plan['owner_module'] ?? '' ) : '';\n\t\t\t\t$command_version = is_array( $owner_plan ) ? sanitize_text_field( $owner_plan['command_version'] ?? '' ) : '';\n\t\t\t\t$owner_plan_json = is_array( $owner_plan ) ? SPF_Runtime::canonical_json( $owner_plan ) : '';\n\t\t\t\tif ( ! is_array( $owner_plan ) || empty( $owner_plan['accepted'] ) || ! in_array( $owner_module, array( 'file-20','file-21' ), true ) || ! SPF_Registry::valid_semver( $command_version ) || false === $owner_plan_json || strlen( $owner_plan_json ) > 32768 ) {\n\t\t\t\t\t$blockers[] = array( 'code'=>'owner_reconciliation_adapter_missing_or_invalid','legacy_key'=>sanitize_key($key),'page_id'=>$page_id );\n\t\t\t\t}\n", 'owner plan validation')
          s = replace_once(s,
          "\t\t\t\t$receipt = apply_filters( 'spf_execute_owner_reconciliation', null, $action, $hash );\n\t\t\t\tif ( ! is_array( $receipt ) || empty( $receipt['success'] ) || empty( $receipt['receipt_id'] ) || empty( $receipt['owner_module'] ) || empty( $receipt['rollback_command'] ) ) {\n\t\t\t\t\tthrow new RuntimeException( 'A canonical owner did not return a reversible reconciliation receipt.' );\n\t\t\t\t}\n\t\t\t\t$receipts[] = SPF_Runtime::canonicalize( $receipt );\n",
          "\t\t\t\t$receipt = apply_filters( 'spf_execute_owner_reconciliation', null, $action, $hash );\n\t\t\t\t$receipt_json = is_array( $receipt ) ? SPF_Runtime::canonical_json( $receipt ) : '';\n\t\t\t\t$expected_owner = sanitize_key( $action['owner_plan']['owner_module'] ?? '' );\n\t\t\t\t$expected_version = sanitize_text_field( $action['owner_plan']['command_version'] ?? '' );\n\t\t\t\tif ( ! is_array( $receipt ) || empty( $receipt['success'] ) || empty( $receipt['receipt_id'] ) || empty( $receipt['owner_module'] ) || empty( $receipt['rollback_command'] ) || sanitize_key( $receipt['owner_module'] ) !== $expected_owner || sanitize_text_field( $receipt['command_version'] ?? '' ) !== $expected_version || false === $receipt_json || strlen( $receipt_json ) > 32768 || strlen( (string) $receipt['receipt_id'] ) > 191 || strlen( (string) $receipt['rollback_command'] ) > 191 ) {\n\t\t\t\t\tthrow new RuntimeException( 'A canonical owner did not return a bounded, version-matched reversible reconciliation receipt.' );\n\t\t\t\t}\n\t\t\t\t$safe_receipt = array(\n\t\t\t\t\t'success'=>true,\n\t\t\t\t\t'receipt_id'=>substr(sanitize_text_field($receipt['receipt_id']),0,191),\n\t\t\t\t\t'owner_module'=>$expected_owner,\n\t\t\t\t\t'command_version'=>$expected_version,\n\t\t\t\t\t'rollback_command'=>substr(sanitize_key($receipt['rollback_command']),0,191),\n\t\t\t\t\t'state_hash'=>preg_match('/^[a-f0-9]{64}$/i',(string)($receipt['state_hash']??''))?strtolower($receipt['state_hash']):'',\n\t\t\t\t);\n\t\t\t\t$receipts[] = SPF_Runtime::canonicalize( $safe_receipt );\n", 'receipt binding')
          s = replace_once(s,
          "\t\t\t\t\tupdate_post_meta( $action['page_id'], '_spf_legacy_owner_receipt', sanitize_text_field( $receipt['receipt_id'] ) );\n",
          "\t\t\t\t\tupdate_post_meta( $action['page_id'], '_spf_legacy_owner_receipt', $safe_receipt['receipt_id'] );\n", 'safe receipt meta')
          s = replace_once(s,
          "\t\t\t\t$changed[] = array( 'legacy_key'=>$action['legacy_key'],'page_id'=>$action['page_id'],'owner_module'=>sanitize_key($receipt['owner_module']),'receipt_id'=>sanitize_text_field($receipt['receipt_id']) );\n",
          "\t\t\t\t$changed[] = array( 'legacy_key'=>$action['legacy_key'],'page_id'=>$action['page_id'],'owner_module'=>$safe_receipt['owner_module'],'receipt_id'=>$safe_receipt['receipt_id'] );\n", 'safe receipt changed')
          s = replace_once(s,
          "\t\t\treturn new WP_Error( 'spf_reconciliation_failed', $error->getMessage(), array( 'status'=>409 ) );\n",
          "\t\t\treturn new WP_Error( 'spf_reconciliation_failed', __( 'Legacy reconciliation failed and compensation was attempted. Review the reconciliation audit evidence.', 'sabri-platform-foundation' ), array( 'status'=>409,'error_class'=>get_class($error) ) );\n", 'error disclosure')
          p.write_text(s)
          PY

          php -l includes/class-spf-registry.php
          php -l includes/class-spf-reconciler.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/class-spf-registry.php includes/class-spf-reconciler.php
          git commit -m 'fix: bound registry contracts and bind reconciliation owner receipts'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
