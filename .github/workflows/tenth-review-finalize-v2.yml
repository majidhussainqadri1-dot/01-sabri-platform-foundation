name: Finalize tenth review v2

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .github/workflows/tenth-review-finalize-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply and commit
        shell: bash
        run: |
          set -euo pipefail
          php tools/tenth-review-finalize.php
          php -l includes/class-spf-audit.php >/dev/null
          php tests/tenth-fresh-eighty-round-review-tests.php
          git rm tools/tenth-review-finalize.php .github/workflows/tenth-review-finalize-v2.yml
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rounds 5-6: fail closed on audit evidence normalization and finalize tenth 80-round manifest'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
