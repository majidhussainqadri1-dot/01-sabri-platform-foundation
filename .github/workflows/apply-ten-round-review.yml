name: Apply File 01 Ten-Round Review

on:
  push:
    branches:
      - codex/file-01-ten-round-staging
    paths:
      - .review/apply.ready

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none

      - name: Apply ten-round reviewed source
        shell: bash
        run: |
          set -euo pipefail
          concat_chunks() {
            local output="$1"
            shift
            : > "$output"
            local file
            for file in "$@"; do
              cat "$file" >> "$output"
              if [ -n "$(tail -c 1 "$file")" ]; then
                printf '\n' >> "$output"
              fi
            done
          }
          concat_chunks /tmp/gov.patch .review/gov.*
          concat_chunks /tmp/eng.patch .review/eng.*
          concat_chunks /tmp/res.patch .review/res.*
          patch -p1 < /tmp/gov.patch
          patch -p1 < /tmp/eng.patch
          patch -p1 < /tmp/res.patch
          concat_chunks tests/future-foundation-tests.php .review/test.*
          cp .review/TEN-ROUND-REVIEW-2026-08-08.md TEN-ROUND-REVIEW-2026-08-08.md

      - name: Remove staging transport and refresh checksums
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .review .github/workflows/apply-ten-round-review.yml
          git add includes/class-spf-governance-control-plane.php includes/class-spf-platform-engineering.php includes/class-spf-resilience-lab.php tests/future-foundation-tests.php TEN-ROUND-REVIEW-2026-08-08.md
          : > SOURCE-CHECKSUMS.sha256
          while IFS= read -r -d '' file; do
            [ "$file" = "SOURCE-CHECKSUMS.sha256" ] && continue
            [ -f "$file" ] || continue
            printf '%s  %s\n' "$(sha256sum "$file" | awk '{print $1}')" "$file"
          done < <(git ls-files -z) | LC_ALL=C sort -k2 > SOURCE-CHECKSUMS.sha256
          git add SOURCE-CHECKSUMS.sha256

      - name: Run exact corrected source QA
        run: bash qa/run-tests.sh

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ten-round adversarial review fixes for File 01 Future Foundation'

      - name: Advance canonical PR branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
