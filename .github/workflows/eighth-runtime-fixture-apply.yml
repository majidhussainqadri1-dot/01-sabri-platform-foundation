name: Eighth Runtime Fixture Apply

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - '.github/workflows/eighth-runtime-fixture-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Apply runtime fixture correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('qa/wp-runtime-smoke.php')
          s = p.read_text()
          old1 = "\t'founder_approval_id'=>'ci-founder-claim-test','approved_scope'=>'disposable CI only','staging_evidence_hash'=>str_repeat('a',64),'rollback_window'=>'30 minutes',"
          new1 = "\t'founder_approval_id'=>'ci-founder-claim-test','approved_scope'=>'disposable CI only','staging_evidence_hash'=>$staged['evidence_hash'],'rollback_window'=>'30 minutes',"
          old2 = "add_filter( 'spf_verify_feature_activation_evidence', static fn() => [ 'verified'=>true,'migration_status'=>'ready','health_status'=>'pass','rollback_evidence'=>'ci-rollback-ready','gate_evidence'=>'ci-gate-proof','verifier'=>'CI runtime','expires_at'=>gmdate('c',time()+3600) ] );"
          new2 = """add_filter( 'spf_verify_feature_activation_evidence', static function ( $claim, array $context ) {
          \treturn [
          \t\t'verified'=>true,
          \t\t'owner_module'=>sanitize_key( $context['owner_module'] ?? '' ),
          \t\t'flag_key'=>sanitize_key( $context['flag_key'] ?? '' ),
          \t\t'environment'=>sanitize_key( $context['environment'] ?? '' ),
          \t\t'readiness_hash'=>(string) ( $context['readiness_hash'] ?? '' ),
          \t\t'migration_status'=>'ready','health_status'=>'pass',
          \t\t'rollback_evidence'=>'ci-rollback-ready','gate_evidence'=>'ci-gate-proof',
          \t\t'verifier'=>'CI runtime','expires_at'=>gmdate('c',time()+3600),
          \t];
          }, 10, 2 );"""
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit('Expected runtime fixture source anchors were not found exactly once.')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
          php -l qa/wp-runtime-smoke.php
      - name: Remove temporary artifacts and refresh checksums
        run: |
          set -euo pipefail
          git rm tools/eighth-runtime-fixture.patch .github/workflows/eighth-runtime-fixture-apply.yml
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
          bash qa/run-tests.sh
      - name: Commit clean runtime fixture correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align eighth-cycle runtime QA fixtures with hardened contracts'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
