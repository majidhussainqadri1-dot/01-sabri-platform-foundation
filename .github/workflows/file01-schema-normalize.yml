name: File 01 dbDelta schema normalization

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .file01-schema-normalize.trigger

permissions:
  contents: write

concurrency:
  group: file01-schema-normalize
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Normalize dbDelta index declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-spf-installer.php')
          s=p.read_text()
          start=s.index('\tpublic static function install_schema()')
          end=s.index('\n\tpublic static function verify_schema()', start)
          head=s[:start]
          block=s[start:end]
          tail=s[end:]
          block=block.replace('), UNIQUE KEY ', '),\n\t\t\tUNIQUE KEY ')
          block=block.replace('), KEY ', '),\n\t\t\tKEY ')
          p.write_text(head+block+tail)
          PY
          php -l includes/class-spf-installer.php
          if grep -En 'PRIMARY KEY.*,( UNIQUE KEY| KEY)|UNIQUE KEY.*,( UNIQUE KEY| KEY)|KEY [^(]+\([^)]*\),( UNIQUE KEY| KEY)' includes/class-spf-installer.php; then
            echo 'Multiple dbDelta index declarations remain on one SQL line.' >&2
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/class-spf-installer.php
          git commit -m 'fix: normalize File 01 dbDelta index declarations for WordPress 7'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
