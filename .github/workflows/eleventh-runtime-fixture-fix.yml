name: File 01 Eleventh Runtime Fixture Fix
on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Apply deterministic fixture correction
        run: python tools/eleventh-runtime-fixture-fix.py
      - name: Remove temporary patch script
        run: rm -f tools/eleventh-runtime-fixture-fix.py
      - name: Commit non-workflow correction
        run: |
          git config user.name 'File 01 Corrective QA'
          git config user.email 'actions@users.noreply.github.com'
          git add ELEVENTH-TEN-ROUND-REVIEW-2026-08-11.md qa/wp-runtime-smoke.php qa/wp-eleventh-ten-round-smoke.php tools/eleventh-runtime-fixture-fix.py
          git commit -m 'test: make migration context negative fixture deterministic'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
