name: Finalize tenth fresh 80-round corrections

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .github/workflows/tenth-review-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Patch audit integrity semantics and commit clean exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('includes/class-spf-audit.php')
          text = p.read_text()
          start = text.index('\tprivate static function sanitize_context')
          end = text.rindex('\n\t}\n\n}') + len('\n\t}')
          replacement = r'''	private static function sanitize_context( array $context, $depth = 0 ) {
		if ( $depth > 5 ) {
			return new WP_Error( 'spf_audit_context_too_deep', __( 'Audit context nesting exceeds the bounded evidence envelope.', 'sabri-platform-foundation' ) );
		}
		if ( count( $context ) > 100 ) {
			return new WP_Error( 'spf_audit_context_too_large', __( 'Audit context exceeds the bounded evidence envelope.', 'sabri-platform-foundation' ) );
		}
		$result = array();
		foreach ( $context as $key => $value ) {
			$raw_key = (string) $key;
			$safe_key = sanitize_key( $raw_key );
			if ( '' === $safe_key || $raw_key !== $safe_key || strlen( $safe_key ) > 128 || array_key_exists( $safe_key, $result ) ) {
				return new WP_Error( 'spf_audit_context_key_invalid', __( 'Audit context keys must already be unique canonical keys within the bounded envelope.', 'sabri-platform-foundation' ) );
			}
			if ( preg_match( '/password|token|secret|authorization|cookie|nonce|sql|path|patient|message|payment|identity|document|private|credential|key/i', $safe_key ) ) {
				$result[ $safe_key ] = '[redacted]';
			} elseif ( is_array( $value ) ) {
				$nested = self::sanitize_context( $value, $depth + 1 );
				if ( is_wp_error( $nested ) ) {
					return $nested;
				}
				$result[ $safe_key ] = $nested;
			} elseif ( is_bool( $value ) || is_int( $value ) || is_float( $value ) || null === $value ) {
				$result[ $safe_key ] = $value;
			} elseif ( is_scalar( $value ) ) {
				$scalar = sanitize_text_field( (string) $value );
				if ( strlen( $scalar ) > 500 ) {
					return new WP_Error( 'spf_audit_context_value_too_large', __( 'Audit context scalar evidence exceeds the bounded envelope.', 'sabri-platform-foundation' ) );
				}
				$result[ $safe_key ] = $scalar;
			} else {
				return new WP_Error( 'spf_audit_context_value_invalid', __( 'Audit context contains an unsupported value type.', 'sabri-platform-foundation' ) );
			}
		}
		return SPF_Runtime::canonicalize( $result );
	}'''
          p.write_text(text[:start] + replacement + text[end:])
          PY
          php -l includes/class-spf-audit.php >/dev/null
          php tests/tenth-fresh-eighty-round-review-tests.php
          git rm .github/workflows/tenth-review-finalize.yml
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rounds 5-6: fail closed on audit evidence normalization and finalize tenth 80-round source manifest'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
