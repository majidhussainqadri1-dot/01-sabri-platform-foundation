name: File 01 Eleventh Ten-Round Apply

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: file-01-eleventh-review-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply corrective source changes
        run: python tools/eleventh-review-apply.py
      - name: Remove one-shot apply machinery
        run: rm -f tools/eleventh-review-apply.py .github/workflows/eleventh-review-apply.yml
      - name: Regenerate exact closed-world source checksums
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
      - name: Pre-commit source QA
        run: bash qa/run-tests.sh
      - name: Commit corrected exact source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'File 01 Corrective QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: eleventh ten-round File 01 corrective review'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
      - name: Dispatch exact-head corrective QA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/corrective-qa.yml/dispatches \
            -d '{"ref":"codex/file-01-complete-foundation-1.0.0"}'
