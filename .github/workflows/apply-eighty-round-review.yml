name: Apply 80 Round Review Payload

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - '.github/workflows/apply-eighty-round-review.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Recover one missing Base64 character and verify payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, pathlib, subprocess
          root = pathlib.Path('tools/eighty-round-bzparts')
          names = ['part00.b64','part01.b64','part02-pre.b64','part02.b64','part04.b64']
          parts = [''.join((root / n).read_text().split()) for n in names]
          print('chunk lengths:', dict(zip(names, map(len, parts))))
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          valid = []
          for ch in alphabet:
              candidate = parts[0] + ch + ''.join(parts[1:])
              try:
                  raw = base64.b64decode(candidate, validate=True)
                  patch = bz2.decompress(raw)
              except Exception:
                  continue
              p = pathlib.Path('/tmp/eighty-review.patch')
              p.write_bytes(patch)
              check = subprocess.run(['git','apply','--check',str(p)], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check.returncode == 0:
                  valid.append((ch, raw, patch))
          if len(valid) != 1:
              raise SystemExit(f'Expected exactly one CRC+git-valid recovery after part00, found {len(valid)}')
          ch, raw, patch = valid[0]
          pathlib.Path('/tmp/eighty-review.recovered-char').write_text(ch)
          pathlib.Path('/tmp/eighty-review.patch.bz2').write_bytes(raw)
          pathlib.Path('/tmp/eighty-review.patch').write_bytes(patch)
          print('Recovered character:', ch)
          print('Compressed bytes:', len(raw), 'patch bytes:', len(patch))
          PY
          bzip2 -t /tmp/eighty-review.patch.bz2
          git apply --check /tmp/eighty-review.patch
          echo '80-round payload Base64 + BZip2 CRC + git dry-run PASS'
      - name: Apply corrective payload
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/eighty-review.patch
          test -f EIGHTY-ROUND-REVIEW-2026-08-09.md
          test -f tests/eighty-round-review-tests.php
          grep -q 'eighty-round-review-tests.php' qa/run-tests.sh
          php -l tests/eighty-round-review-tests.php
          echo '80-round corrective payload applied'
      - name: Remove staging artifacts and refresh checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/eighty-round-bzparts
          rm -f .github/workflows/apply-eighty-round-review.yml
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
      - name: Run full source regression
        shell: bash
        run: |
          set -euo pipefail
          bash qa/run-tests.sh
      - name: Commit clean corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete 80-round File 01 corrective review and fixes'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
