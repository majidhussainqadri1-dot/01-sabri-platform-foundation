name: Refresh File 01 source checksums

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .github/workflows/refresh-source-checksums.yml

permissions:
  contents: write

concurrency:
  group: file01-refresh-source-checksums
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Regenerate exact source checksums
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \
            ! -path './.git/*' \
            ! -path './build/*' \
            ! -path './dist/*' \
            ! -path './.github/workflows/refresh-source-checksums.yml' \
            ! -name 'SOURCE-CHECKSUMS.sha256' \
            -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
          sha256sum --check SOURCE-CHECKSUMS.sha256
      - name: Commit manifest only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE-CHECKSUMS.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh exact File 01 source checksums'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
