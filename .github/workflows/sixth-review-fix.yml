name: File 01 Sixth Review Fix

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .github/workflows/sixth-review-fix.yml

permissions:
  contents: write

jobs:
  apply-sixth-review:
    if: ${{ !contains(github.event.head_commit.message, '[sixth-fix-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply sixth-cycle source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, pathlib
          payload = ''
          pathlib.Path('/tmp/sixth-source.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --check /tmp/sixth-source.patch
          git apply /tmp/sixth-source.patch
          python3 - <<'PY'
          from pathlib import Path

          p = Path('qa/run-tests.sh')
          s = p.read_text()
          old = "php tests/fifth-ten-round-review-tests.php\nphp tests/source-quality-tests.php"
          new = "php tests/fifth-ten-round-review-tests.php\nphp tests/sixth-ten-round-review-tests.php\nphp tests/source-quality-tests.php"
          if old not in s:
              raise SystemExit('qa/run-tests.sh insertion point not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tools/build-package.sh')
          s = p.read_text()
          old = "    FIFTH-TEN-ROUND-REVIEW-2026-08-08.md\n"
          new = "    FIFTH-TEN-ROUND-REVIEW-2026-08-08.md SIXTH-TEN-ROUND-REVIEW-2026-08-08.md\n"
          if old not in s:
              raise SystemExit('tools/build-package.sh insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate, bind checksums, and run complete source QA
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/sixth-ten-round-review-tests.php
          for file in includes/class-spf-installer.php includes/class-spf-system-check.php includes/class-spf-registry.php includes/class-spf-governance-control-plane.php includes/class-spf-runtime.php includes/class-spf-authorization.php includes/class-spf-privacy.php includes/class-spf-purge.php includes/class-spf-platform-engineering.php; do
            php -l "$file"
          done
          rm .github/workflows/sixth-review-fix.yml
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' -not -name 'SOURCE-CHECKSUMS.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
          bash qa/run-tests.sh
          bash tools/build-package.sh
      - name: Commit exact corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m '[sixth-fix-applied] File 01 sixth ten-round corrective hardening'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
