name: File 01 Review 1 Follow-up

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .file01-review1-followup.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - run: python3 tools/file01-review1-indexfix.py
      - run: |
          php -l includes/class-spf-installer.php
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/class-spf-installer.php
          git commit -m 'fix: match required-index verification to the exact File 01 schema'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
