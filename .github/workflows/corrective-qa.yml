name: File 01 Corrective QA

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-01-corrective-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-qa:
    name: PHP ${{ matrix.php }} source QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run source QA
        run: bash qa/run-tests.sh

  wordpress-runtime:
    name: WordPress and MySQL runtime QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Install WP-CLI and WordPress
        run: |
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          mkdir -p /tmp/wp
          wp core download --path=/tmp/wp --force
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp config set SPF_ALLOW_INTERNAL_SNAPSHOT_UPGRADE true --raw --path=/tmp/wp
          wp config set SPF_ALLOW_DESTRUCTIVE_PURGE true --raw --path=/tmp/wp
          ADMIN_PASS="$(openssl rand -hex 18)"
          wp core install --path=/tmp/wp --url=http://example.test --title='File 01 CI' --admin_user=admin --admin_password="$ADMIN_PASS" --admin_email=admin@example.test --skip-email
      - name: Install and activate exact plugin source
        run: |
          mkdir -p /tmp/wp/wp-content/plugins/sabri-platform-foundation-01
          rsync -a --delete --exclude=.git --exclude=build --exclude=dist ./ /tmp/wp/wp-content/plugins/sabri-platform-foundation-01/
          wp plugin activate sabri-platform-foundation-01 --user=admin --path=/tmp/wp
      - name: Run WordPress/MySQL integration tests
        run: wp eval-file /tmp/wp/wp-content/plugins/sabri-platform-foundation-01/qa/wp-runtime-smoke.php --user=admin --path=/tmp/wp
      - name: Run Future Foundation 18-enhancement runtime smoke
        run: wp eval-file /tmp/wp/wp-content/plugins/sabri-platform-foundation-01/qa/wp-future-foundation-smoke.php --user=admin --path=/tmp/wp
      - name: Run concurrent idempotency test
        run: |
          wp option delete spf_concurrency_counter --path=/tmp/wp || true
          wp db query "DELETE FROM wp_spf_idempotency WHERE action_name='concurrency_probe'" --path=/tmp/wp
          wp eval-file /tmp/wp/wp-content/plugins/sabri-platform-foundation-01/qa/wp-idempotency-worker.php --user=admin --path=/tmp/wp >/tmp/worker1.log 2>&1 &
          P1=$!
          wp eval-file /tmp/wp/wp-content/plugins/sabri-platform-foundation-01/qa/wp-idempotency-worker.php --user=admin --path=/tmp/wp >/tmp/worker2.log 2>&1 &
          P2=$!
          wait "$P1" || true
          wait "$P2" || true
          cat /tmp/worker1.log /tmp/worker2.log
          test "$(wp option get spf_concurrency_counter --path=/tmp/wp)" = "1"
          wp eval-file /tmp/wp/wp-content/plugins/sabri-platform-foundation-01/qa/wp-idempotency-worker.php --user=admin --path=/tmp/wp
          test "$(wp option get spf_concurrency_counter --path=/tmp/wp)" = "1"
      - name: Run disposable destructive-purge smoke
        run: wp eval-file /tmp/wp/wp-content/plugins/sabri-platform-foundation-01/qa/wp-purge-smoke.php --user=admin --path=/tmp/wp

  deterministic-package:
    name: Deterministic package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [source-qa, wordpress-runtime]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Run source QA
        run: bash qa/run-tests.sh
      - name: Build twice and compare
        run: bash tools/build-package.sh
      - name: Verify generated package checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(php -r '$s=file_get_contents("sabri-platform-foundation.php"); preg_match("/define\\( \\x27SPF_VERSION\\x27, \\x27([^\\x27]+)\\x27 \\)/",$s,$m); echo $m[1] ?? "";')"
          test -n "$VERSION"
          cd dist
          sha256sum --check "01-sabri-platform-foundation-${VERSION}-FUTURE-FOUNDATION-SUPERSET-CANDIDATE.zip.sha256"
      - name: Upload package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: file-01-future-foundation-superset-package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
