name: Finalize File 01 Third Review Checksum

on:
  push:
    branches:
      - codex/file-01-third-ten-round-review-2026-08-08
    paths:
      - .github/workflows/finalize-third-review-checksum.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-third-ten-round-review-2026-08-08
          path: transport
          fetch-depth: 1

      - name: Checkout target and refresh exact checksum manifest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate, verify and push checksum-only finalization
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          : > SOURCE-CHECKSUMS.sha256
          while IFS= read -r file; do
            sha256sum "$file" >> SOURCE-CHECKSUMS.sha256
          done < <(git ls-files | grep -v '^SOURCE-CHECKSUMS\.sha256$' | grep -v '^build/' | grep -v '^dist/' | LC_ALL=C sort)
          sha256sum --check SOURCE-CHECKSUMS.sha256
          git add SOURCE-CHECKSUMS.sha256
          if git diff --cached --quiet; then
            echo 'Checksum manifest already exact.'
            exit 0
          fi
          git commit -m 'Finalize third review source checksums'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
