name: Fix tenth-review Round 75 QA contract

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .github/workflows/tenth-review-qa-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Correct brittle staging-pending assertion and review record
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("tests/tenth-fresh-eighty-round-review-tests.php"); t=p.read_text(); old="75 => array(\u0027STAGING-ACCEPTANCE.md\u0027, \u0027PENDING\u0027, \u0027staging status is not explicitly pending\u0027)"; new="75 => array(\u0027STAGING-ACCEPTANCE.md\u0027, \u0027- [ ]\u0027, \u0027staging acceptance checklist is not visibly pending\u0027)"; assert old in t; p.write_text(t.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("TENTH-FRESH-EIGHTY-ROUND-REVIEW-2026-08-10.md"); t=p.read_text(); t=t.replace("Defect-bearing rounds: **1–8 (8/80)**.","Defect-bearing rounds: **1–8 and 75 (9/80)**.",1).replace("Clean post-correction rounds: **9–80 (72/80)**.","Clean post-correction rounds: **9–74 and 76–80 (71/80)**.",1); old="| 75 | CLEAN | Truthful Staging-Accepted pending status. | No new defect found after prior corrections. |"; new="| 75 | QA-CONTRACT DEFECT FOUND → FIXED | Staging status validation expected a literal `PENDING` token although the canonical acceptance file expresses pending state through unchecked checklist items. | Regression harness now validates the unchecked acceptance checklist rather than a brittle literal. |"; assert old in t; p.write_text(t.replace(old,new,1))'
          php -l tests/tenth-fresh-eighty-round-review-tests.php >/dev/null
          git rm .github/workflows/tenth-review-qa-contract-fix.yml
          find . -type f -not -path './.git/*' -not -path './build/*' -not -path './dist/*' ! -name 'SOURCE-CHECKSUMS.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE-CHECKSUMS.sha256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Round 75: align staging-pending regression assertion with checklist truth'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
