name: Apply File 01 corrective payload parts

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .codex/file01-payload.part04

permissions:
  contents: write

concurrency:
  group: file01-payload-parts-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Verify and apply exact corrective source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .codex/file01-payload.part01 .codex/file01-payload.part02 .codex/file01-payload.part03 .codex/file01-payload.part04 | base64 -d > /tmp/file01-payload.tar.gz
          echo '1d758c1b98baca97fac5fc2710575f24529dc7154878aacb1a76e01002e9de4d  /tmp/file01-payload.tar.gz' | sha256sum --check -
          tar -xzf /tmp/file01-payload.tar.gz -C .
          rm -rf .codex
          rm -f .github/workflows/file01-payload-apply.yml .github/workflows/file01-payload-parts-apply.yml
          bash qa/run-tests.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete File 01 governance runtime and adversarial corrections'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
