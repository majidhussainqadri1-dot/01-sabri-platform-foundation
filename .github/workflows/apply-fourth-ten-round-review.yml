name: Apply File 01 Fourth Ten-Round Review

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'BEGIN-FOURTH-REVIEW')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0

      - name: Apply ten sequential review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match in {path}, found {text.count(old)}")
              write(path, text.replace(old, new, 1))
              print(f"{label}: fixed")

          # Round 1 — operational completion truth must require literal verified=true.
          replace_once(
              'includes/class-spf-plugin.php',
              "$operational = is_array( $operational_claim ) && ! empty( $operational_claim['verified'] ) && 'deployed' === $release_status && is_array( $health ) && 'pass' === ( $health['overall_status'] ?? '' );",
              "$operational = is_array( $operational_claim ) && array_key_exists( 'verified', $operational_claim ) && true === $operational_claim['verified'] && 'deployed' === $release_status && is_array( $health ) && 'pass' === ( $health['overall_status'] ?? '' );",
              'Round 1 operational truth semantics'
          )

          # Round 2 — Future Foundation tick becomes activation/snapshot/deactivation managed, while runtime fallback is error-aware.
          replace_once(
              'includes/class-spf-installer.php',
              "\t\t\tarray( 'hook' => 'spf_reconcile_expired_flags', 'time' => time() + 300, 'recurrence' => 'hourly' ),\n\t\t);",
              "\t\t\tarray( 'hook' => 'spf_reconcile_expired_flags', 'time' => time() + 300, 'recurrence' => 'hourly' ),\n\t\t\tarray( 'hook' => 'spf_future_foundation_tick', 'time' => time() + 300, 'recurrence' => 'spf_five_minutes' ),\n\t\t);",
              'Round 2 activation-managed future cron'
          )
          replace_once(
              'includes/class-spf-installer.php',
              "foreach ( array( 'spf_dispatch_outbox', 'spf_privacy_retention', 'spf_reconcile_expired_flags' ) as $hook )",
              "foreach ( array( 'spf_dispatch_outbox', 'spf_privacy_retention', 'spf_reconcile_expired_flags', 'spf_future_foundation_tick' ) as $hook )",
              'Round 2 deactivation-managed future cron'
          )
          replace_once(
              'includes/class-spf-installer.php',
              "foreach ( array( 'spf_dispatch_outbox','spf_privacy_retention','spf_reconcile_expired_flags' ) as $hook )",
              "foreach ( array( 'spf_dispatch_outbox','spf_privacy_retention','spf_reconcile_expired_flags','spf_future_foundation_tick' ) as $hook )",
              'Round 2 snapshot-managed future cron'
          )
          replace_once(
              'includes/class-spf-future-foundation.php',
              "\t\tif ( ! wp_next_scheduled( 'spf_future_foundation_tick' ) ) {\n\t\t\twp_schedule_event( time() + 300, 'spf_five_minutes', 'spf_future_foundation_tick' );\n\t\t}",
              "\t\tif ( ! wp_next_scheduled( 'spf_future_foundation_tick' ) ) {\n\t\t\t$scheduled = wp_schedule_event( time() + 300, 'spf_five_minutes', 'spf_future_foundation_tick', array(), true );\n\t\t\tif ( is_wp_error( $scheduled ) || false === $scheduled ) {\n\t\t\t\tdo_action( 'spf_future_foundation_schedule_failure', $scheduled );\n\t\t\t}\n\t\t}",
              'Round 2 runtime cron fallback truth'
          )

          # Round 3 — authorization contract integer fields must remain integers, not coercible truthy/scalar substitutes.
          replace_once(
              'includes/class-spf-authorization.php',
              "\t\tif ( absint( $claim['user_id'] ) !== absint( $user_id ) || sanitize_key( $claim['action'] ) !== sanitize_key( $action ) ) {\n\t\t\treturn false;\n\t\t}\n\t\tif ( array_key_exists( 'actor_id', $claim ) && absint( $claim['actor_id'] ) !== absint( $user_id ) ) {\n\t\t\treturn false;\n\t\t}",
              "\t\tif ( ! is_int( $claim['user_id'] ) || $claim['user_id'] < 1 || $claim['user_id'] !== (int) $user_id || sanitize_key( $claim['action'] ) !== sanitize_key( $action ) ) {\n\t\t\treturn false;\n\t\t}\n\t\tif ( array_key_exists( 'actor_id', $claim ) && ( ! is_int( $claim['actor_id'] ) || $claim['actor_id'] < 1 || $claim['actor_id'] !== (int) $user_id ) ) {\n\t\t\treturn false;\n\t\t}",
              'Round 3 strict authorization integer contract'
          )

          # Round 4 — outbox recovery/select database failures may never be reported as a successful empty dispatch.
          replace_once(
              'includes/class-spf-event-bus.php',
              "\t\t\t$processed['recovered'] = (int) $wpdb->query(\n\t\t\t\t$wpdb->prepare(\n\t\t\t\t\t\"UPDATE {$table} SET status='retry',available_at=%s,last_error='stale_processing_recovered' WHERE status='processing' AND available_at<%s\",\n\t\t\t\t\t$now,\n\t\t\t\t\t$stale_before\n\t\t\t\t)\n\t\t\t);\n\t\t\t$limit = max( 1, min( 100, absint( $limit ) ) );\n\t\t\t$rows = $wpdb->get_results( $wpdb->prepare( \"SELECT * FROM {$table} WHERE status IN ('pending','retry') AND available_at<=%s ORDER BY id ASC LIMIT %d\", $now, $limit ), ARRAY_A );",
              "\t\t\t$recovered = $wpdb->query(\n\t\t\t\t$wpdb->prepare(\n\t\t\t\t\t\"UPDATE {$table} SET status='retry',available_at=%s,last_error='stale_processing_recovered' WHERE status='processing' AND available_at<%s\",\n\t\t\t\t\t$now,\n\t\t\t\t\t$stale_before\n\t\t\t\t)\n\t\t\t);\n\t\t\tif ( false === $recovered ) {\n\t\t\t\treturn new WP_Error( 'spf_outbox_recovery_query_failed', __( 'The outbox stale-lease recovery query failed.', 'sabri-platform-foundation' ), array( 'status'=>503 ) );\n\t\t\t}\n\t\t\t$processed['recovered'] = (int) $recovered;\n\t\t\t$limit = max( 1, min( 100, absint( $limit ) ) );\n\t\t\t$rows = $wpdb->get_results( $wpdb->prepare( \"SELECT * FROM {$table} WHERE status IN ('pending','retry') AND available_at<=%s ORDER BY id ASC LIMIT %d\", $now, $limit ), ARRAY_A );\n\t\t\tif ( ! empty( $wpdb->last_error ) ) {\n\t\t\t\treturn new WP_Error( 'spf_outbox_select_failed', __( 'The outbox dispatch query failed.', 'sabri-platform-foundation' ), array( 'status'=>503 ) );\n\t\t\t}",
              'Round 4 outbox DB fail-closed'
          )

          # Round 5 — malformed amendment IDs/timestamps must not become empty IDs or Unix epoch governance facts.
          replace_once(
              'includes/class-spf-governance.php',
              "\t\tif ( ! is_array( $amendment['decision'] ) ) {\n\t\t\treturn new WP_Error( 'spf_invalid_amendment', __( 'Decision must be structured.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\t$allowed = SPF_Authorization::require_action( 'approve_amendment', array( 'object_id' => $amendment['amendment_id'] ), array( 'purpose' => $context['purpose'] ?? 'change_control' ) );\n\t\tif ( is_wp_error( $allowed ) ) {\n\t\t\treturn $allowed;\n\t\t}\n\t\t$id = substr( sanitize_text_field( $amendment['amendment_id'] ), 0, 64 );",
              "\t\tif ( ! is_array( $amendment['decision'] ) ) {\n\t\t\treturn new WP_Error( 'spf_invalid_amendment', __( 'Decision must be structured.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\t$id = substr( sanitize_text_field( $amendment['amendment_id'] ), 0, 64 );\n\t\tif ( '' === $id ) {\n\t\t\treturn new WP_Error( 'spf_invalid_amendment_id', __( 'Amendment identifier is invalid after normalization.', 'sabri-platform-foundation' ), array( 'status'=>400 ) );\n\t\t}\n\t\t$effective_ts = strtotime( (string) $amendment['effective_at'] );\n\t\tif ( false === $effective_ts ) {\n\t\t\treturn new WP_Error( 'spf_invalid_amendment_effective_at', __( 'Amendment effective time is invalid.', 'sabri-platform-foundation' ), array( 'status'=>400 ) );\n\t\t}\n\t\t$effective_at = gmdate( 'Y-m-d H:i:s', $effective_ts );\n\t\t$allowed = SPF_Authorization::require_action( 'approve_amendment', array( 'object_id' => $id ), array( 'purpose' => $context['purpose'] ?? 'change_control' ) );\n\t\tif ( is_wp_error( $allowed ) ) {\n\t\t\treturn $allowed;\n\t\t}",
              'Round 5 amendment identity/time validation'
          )
          replace_once(
              'includes/class-spf-governance.php',
              "'effective_at'=>gmdate('Y-m-d H:i:s',strtotime($amendment['effective_at']))",
              "'effective_at'=>$effective_at",
              'Round 5 normalized amendment timestamp storage'
          )
          replace_once(
              'includes/class-spf-governance.php',
              "array( 'effective_at'=>$amendment['effective_at'] )",
              "array( 'effective_at'=>$effective_at )",
              'Round 5 normalized amendment timestamp event'
          )

          # Round 6 — expired-flag state change and durable event become one transaction; DB scan errors fail closed.
          path = 'includes/class-spf-governance.php'
          text = read(path)
          pattern = re.compile(r"\tpublic static function reconcile_expired_flags\(\) \{.*?\n\t\}\n\n\tpublic static function get_release", re.S)
          replacement = r'''\tpublic static function reconcile_expired_flags() {
\t\tglobal $wpdb;
\t\t$table = SPF_Installer::table( 'flags' );
\t\t$rows = $wpdb->get_results( $wpdb->prepare( "SELECT * FROM {$table} WHERE enabled=1 AND expires_at IS NOT NULL AND expires_at<=%s LIMIT 100", SPF_Runtime::now_mysql() ), ARRAY_A );
\t\tif ( ! empty( $wpdb->last_error ) ) {
\t\t\treturn new WP_Error( 'spf_flag_expiry_query_failed', __( 'Expired feature flags could not be queried safely.', 'sabri-platform-foundation' ), array( 'status'=>503 ) );
\t\t}
\t\t$result = array( 'expired'=>0, 'conflict'=>0, 'failed'=>0, 'event_failed'=>0 );
\t\tforeach ( $rows as $row ) {
\t\t\t$tx = SPF_Runtime::begin();
\t\t\tif ( is_wp_error( $tx ) ) {
\t\t\t\t$result['failed']++;
\t\t\t\tcontinue;
\t\t\t}
\t\t\t$updated = $wpdb->update( $table, array( 'enabled'=>0,'record_version'=>(int)$row['record_version']+1,'updated_at'=>SPF_Runtime::now_mysql(),'reason'=>substr($row['reason'].' [expired]',0,500) ), array( 'id'=>(int)$row['id'],'record_version'=>(int)$row['record_version'],'enabled'=>1 ) );
\t\t\tif ( false === $updated ) {
\t\t\t\tSPF_Runtime::rollback();
\t\t\t\t$result['failed']++;
\t\t\t\tSPF_Audit::record( 'feature_flag_expiry_write_failed', 'foundation_flag', $row['owner_module'].':'.$row['flag_key'].':'.$row['environment'], 'failed', array( 'purpose'=>'flag_expiry_reconciliation' ) );
\t\t\t\tcontinue;
\t\t\t}
\t\t\tif ( 1 !== $updated ) {
\t\t\t\tSPF_Runtime::rollback();
\t\t\t\t$result['conflict']++;
\t\t\t\tcontinue;
\t\t\t}
\t\t\t$event = SPF_Event_Bus::publish( 'FeatureFlagExpired.v1', 'foundation_flag', $row['owner_module'].':'.$row['flag_key'].':'.$row['environment'], array( 'owner_module'=>$row['owner_module'],'flag_key'=>$row['flag_key'],'environment'=>$row['environment'] ), 1, 'flag-expired-'.$row['id'].'-'.$row['record_version'] );
\t\t\tif ( is_wp_error( $event ) ) {
\t\t\t\tSPF_Runtime::rollback();
\t\t\t\t$result['event_failed']++;
\t\t\t\tSPF_Audit::record( 'feature_flag_expiry_event_failed', 'foundation_flag', $row['owner_module'].':'.$row['flag_key'].':'.$row['environment'], 'failed', array( 'purpose'=>'flag_expiry_reconciliation' ) );
\t\t\t\tcontinue;
\t\t\t}
\t\t\t$commit = SPF_Runtime::commit();
\t\t\tif ( is_wp_error( $commit ) ) {
\t\t\t\tSPF_Runtime::rollback();
\t\t\t\t$result['failed']++;
\t\t\t\tSPF_Audit::record( 'feature_flag_expiry_commit_failed', 'foundation_flag', $row['owner_module'].':'.$row['flag_key'].':'.$row['environment'], 'failed', array( 'purpose'=>'flag_expiry_reconciliation' ) );
\t\t\t\tcontinue;
\t\t\t}
\t\t\t$result['expired']++;
\t\t}
\t\treturn $result;
\t}

\tpublic static function get_release'''
          text2, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'Round 6: expected one reconcile_expired_flags function, found {n}')
          write(path, text2)
          print('Round 6 transactional flag expiry: fixed')

          # Round 7 — privacy request insert + mandatory audit become atomic and reject invalid subjects/basis.
          path = 'includes/class-spf-privacy.php'
          text = read(path)
          pattern = re.compile(r"\tpublic static function create_request\( \$user_id, \$type, \$purpose, \$legal_basis \) \{.*?\n\t\}\n\n\tpublic static function has_active_hold", re.S)
          replacement = r'''\tpublic static function create_request( $user_id, $type, $purpose, $legal_basis ) {
\t\tglobal $wpdb;
\t\t$user_id = absint( $user_id );
\t\t$type = sanitize_key( $type );
\t\t$purpose = substr( sanitize_text_field( $purpose ), 0, 191 );
\t\t$legal_basis = substr( sanitize_text_field( $legal_basis ), 0, 191 );
\t\tif ( $user_id < 1 || ! get_userdata( $user_id ) ) {
\t\t\treturn new WP_Error( 'spf_privacy_request_user_invalid', __( 'Privacy request requires an existing user subject.', 'sabri-platform-foundation' ), array( 'status'=>400 ) );
\t\t}
\t\tif ( ! in_array( $type, array( 'export','erasure','correction' ), true ) ) {
\t\t\treturn new WP_Error( 'spf_privacy_request_invalid', __( 'Invalid privacy request type.', 'sabri-platform-foundation' ) );
\t\t}
\t\tif ( '' === $purpose || '' === $legal_basis ) {
\t\t\treturn new WP_Error( 'spf_privacy_request_basis_required', __( 'Privacy request purpose and legal basis are required.', 'sabri-platform-foundation' ), array( 'status'=>400 ) );
\t\t}
\t\t$request_id = wp_generate_uuid4();
\t\t$now = SPF_Runtime::now_mysql();
\t\t$due = gmdate( 'Y-m-d H:i:s', time() + 30 * DAY_IN_SECONDS );
\t\t$tx = SPF_Runtime::begin();
\t\tif ( is_wp_error( $tx ) ) {
\t\t\treturn $tx;
\t\t}
\t\ttry {
\t\t\t$ok = $wpdb->insert(
\t\t\t\tSPF_Installer::table( 'privacy_requests' ),
\t\t\t\tarray( 'request_id' => $request_id, 'user_id' => $user_id, 'request_type' => $type, 'status' => 'received', 'purpose' => $purpose, 'legal_basis' => $legal_basis, 'result_json' => '{}', 'record_version' => 1, 'requested_at' => $now, 'due_at' => $due )
\t\t\t);
\t\t\tif ( false === $ok ) {
\t\t\t\tthrow new RuntimeException( 'Privacy request could not be recorded.' );
\t\t\t}
\t\t\t$audit = SPF_Audit::record_required( 'privacy_request_received', 'foundation_privacy_request', $request_id, 'success', array( 'purpose' => $purpose, 'request_type' => $type ) );
\t\t\tif ( is_wp_error( $audit ) ) {
\t\t\t\tthrow new RuntimeException( $audit->get_error_message() );
\t\t\t}
\t\t\t$commit = SPF_Runtime::commit();
\t\t\tif ( is_wp_error( $commit ) ) {
\t\t\t\tthrow new RuntimeException( $commit->get_error_message() );
\t\t\t}
\t\t\treturn array( 'request_id' => $request_id, 'status' => 'received', 'due_at' => $due );
\t\t} catch ( Throwable $error ) {
\t\t\tSPF_Runtime::rollback();
\t\t\treturn new WP_Error( 'spf_privacy_request_failed', $error->getMessage(), array( 'status'=>503 ) );
\t\t}
\t}

\tpublic static function has_active_hold'''
          text2, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'Round 7: expected one create_request function, found {n}')
          write(path, text2)
          print('Round 7 atomic privacy request: fixed')

          # Round 8 — legal/privacy hold read failures must block erasure instead of failing open.
          replace_once(
              'includes/class-spf-privacy.php',
              "\t\treturn (bool) $wpdb->get_var( $wpdb->prepare( \"SELECT 1 FROM {$table} WHERE subject_type=%s AND subject_id=%s AND active=1 LIMIT 1\", sanitize_key( $subject_type ), substr( sanitize_text_field( $subject_id ), 0, 191 ) ) );",
              "\t\t$active = $wpdb->get_var( $wpdb->prepare( \"SELECT 1 FROM {$table} WHERE subject_type=%s AND subject_id=%s AND active=1 LIMIT 1\", sanitize_key( $subject_type ), substr( sanitize_text_field( $subject_id ), 0, 191 ) ) );\n\t\tif ( ! empty( $wpdb->last_error ) ) {\n\t\t\tSPF_Audit::record( 'privacy_hold_query_failed', 'foundation_privacy', 'hold-registry', 'failed', array( 'purpose'=>'privacy_hold_fail_closed' ) );\n\t\t\treturn true;\n\t\t}\n\t\treturn null !== $active;",
              'Round 8 privacy hold fail-closed'
          )

          # Round 9 — audit chain DB read failures must never look like an empty or verified chain.
          replace_once(
              'includes/class-spf-audit.php',
              "\t\t\t$previous_raw = $wpdb->get_var( \"SELECT entry_hash FROM {$table} ORDER BY id DESC LIMIT 1\" ); // phpcs:ignore WordPress.DB.PreparedSQL.InterpolatedNotPrepared -- allowlisted table.\n\t\t\tif ( null === $previous_raw || '' === (string) $previous_raw ) {",
              "\t\t\t$previous_raw = $wpdb->get_var( \"SELECT entry_hash FROM {$table} ORDER BY id DESC LIMIT 1\" ); // phpcs:ignore WordPress.DB.PreparedSQL.InterpolatedNotPrepared -- allowlisted table.\n\t\t\tif ( ! empty( $wpdb->last_error ) ) {\n\t\t\t\treturn new WP_Error( 'spf_audit_head_read_failed', __( 'The audit chain head could not be read safely.', 'sabri-platform-foundation' ) );\n\t\t\t}\n\t\t\tif ( null === $previous_raw || '' === (string) $previous_raw ) {",
              'Round 9 audit append head read'
          )
          replace_once(
              'includes/class-spf-audit.php',
              "\t\t$total = (int) $wpdb->get_var( \"SELECT COUNT(*) FROM {$table}\" ); // phpcs:ignore WordPress.DB.PreparedSQL.InterpolatedNotPrepared -- allowlisted table.\n\t\tif ( $total > $limit ) {",
              "\t\t$total_raw = $wpdb->get_var( \"SELECT COUNT(*) FROM {$table}\" ); // phpcs:ignore WordPress.DB.PreparedSQL.InterpolatedNotPrepared -- allowlisted table.\n\t\tif ( ! empty( $wpdb->last_error ) || null === $total_raw ) {\n\t\t\treturn new WP_Error( 'spf_audit_verification_query_failed', __( 'Audit chain row count could not be verified.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\t$total = (int) $total_raw;\n\t\tif ( $total > $limit ) {",
              'Round 9 audit verification count'
          )
          replace_once(
              'includes/class-spf-audit.php',
              "\t\t$rows = $wpdb->get_results( $wpdb->prepare( \"SELECT * FROM {$table} ORDER BY id ASC LIMIT %d\", $limit ), ARRAY_A );\n\t\t$previous = str_repeat( '0', 64 );",
              "\t\t$rows = $wpdb->get_results( $wpdb->prepare( \"SELECT * FROM {$table} ORDER BY id ASC LIMIT %d\", $limit ), ARRAY_A );\n\t\tif ( ! empty( $wpdb->last_error ) ) {\n\t\t\treturn new WP_Error( 'spf_audit_verification_query_failed', __( 'Audit chain rows could not be read for verification.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\t$previous = str_repeat( '0', 64 );",
              'Round 9 audit verification rows'
          )
          replace_once(
              'includes/class-spf-audit.php',
              "\t\t$stored_head = (string) $wpdb->get_var( \"SELECT entry_hash FROM {$table} ORDER BY id DESC LIMIT 1\" ); // phpcs:ignore WordPress.DB.PreparedSQL.InterpolatedNotPrepared -- allowlisted table.\n\t\tif ( $total > 0 && ! hash_equals( $previous, $stored_head ) ) {",
              "\t\t$stored_head_raw = $wpdb->get_var( \"SELECT entry_hash FROM {$table} ORDER BY id DESC LIMIT 1\" ); // phpcs:ignore WordPress.DB.PreparedSQL.InterpolatedNotPrepared -- allowlisted table.\n\t\tif ( ! empty( $wpdb->last_error ) ) {\n\t\t\treturn new WP_Error( 'spf_audit_verification_query_failed', __( 'Audit chain head could not be re-read after verification.', 'sabri-platform-foundation' ) );\n\t\t}\n\t\t$stored_head = (string) $stored_head_raw;\n\t\tif ( $total > 0 && ! hash_equals( $previous, $stored_head ) ) {",
              'Round 9 audit verification head'
          )

          # Round 10 — health checks include Future Foundation cron, fail closed on DB probes, and transaction probe proves the insert actually happened.
          replace_once(
              'includes/class-spf-system-check.php',
              "array( 'hooks'=>array('spf_dispatch_outbox','spf_privacy_retention','spf_reconcile_expired_flags') )",
              "array( 'hooks'=>array('spf_dispatch_outbox','spf_privacy_retention','spf_reconcile_expired_flags','spf_future_foundation_tick') )",
              'Round 10 external cron evidence scope'
          )
          replace_once(
              'includes/class-spf-system-check.php',
              "foreach ( array( 'spf_dispatch_outbox','spf_privacy_retention','spf_reconcile_expired_flags' ) as $hook )",
              "foreach ( array( 'spf_dispatch_outbox','spf_privacy_retention','spf_reconcile_expired_flags','spf_future_foundation_tick' ) as $hook )",
              'Round 10 required schedule health'
          )
          replace_once(
              'includes/class-spf-system-check.php',
              "\t\t$pending=(int)$wpdb->get_var(\"SELECT COUNT(*) FROM {$table} WHERE status IN ('pending','retry','processing')\"); // phpcs:ignore\n\t\t$dead=(int)$wpdb->get_var(\"SELECT COUNT(*) FROM {$table} WHERE status='dead'\"); // phpcs:ignore\n\t\t$oldest=(string)$wpdb->get_var(\"SELECT MIN(created_at) FROM {$table} WHERE status IN ('pending','retry','processing')\"); // phpcs:ignore",
              "\t\t$pending_raw=$wpdb->get_var(\"SELECT COUNT(*) FROM {$table} WHERE status IN ('pending','retry','processing')\"); // phpcs:ignore\n\t\tif(!empty($wpdb->last_error)){return array(self::check('outbox_query',false,'query-failed','Outbox health query failed.','fail'));}\n\t\t$dead_raw=$wpdb->get_var(\"SELECT COUNT(*) FROM {$table} WHERE status='dead'\"); // phpcs:ignore\n\t\tif(!empty($wpdb->last_error)){return array(self::check('outbox_query',false,'query-failed','Outbox dead-letter query failed.','fail'));}\n\t\t$oldest_raw=$wpdb->get_var(\"SELECT MIN(created_at) FROM {$table} WHERE status IN ('pending','retry','processing')\"); // phpcs:ignore\n\t\tif(!empty($wpdb->last_error)){return array(self::check('outbox_query',false,'query-failed','Outbox age query failed.','fail'));}\n\t\t$pending=(int)$pending_raw;\n\t\t$dead=(int)$dead_raw;\n\t\t$oldest=(string)$oldest_raw;",
              'Round 10 outbox health DB truth'
          )
          replace_once(
