name: Fourteenth Review Apply

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .github/workflows/fourteenth-review-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: file-01-fourteenth-review-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: codex/file-01-complete-foundation-1.0.0
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply reviewed non-workflow source patch
        shell: bash
        env:
          PATCH_B64: ''
        run: |
          set -euo pipefail
          # The branch must differ from the frozen starting HEAD only by this temporary workflow.
          test "$(git rev-parse HEAD^)" = "38d231e2ede862d9fea8be7df90ec2271274bb7c"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/fourteenth.patch
          git apply --check /tmp/fourteenth.patch
          git apply /tmp/fourteenth.patch
          bash qa/run-tests.sh
          git config user.name 'File 01 Fourteenth Review'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): apply fourteenth sequential corrective review source changes'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
