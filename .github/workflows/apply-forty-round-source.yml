name: Recover and apply File 01 forty-round source

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .codex/review40.trigger

permissions:
  contents: write

concurrency:
  group: file01-review40-source-recovery
  cancel-in-progress: false

jobs:
  recover-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete corrective history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0

      - name: Recover a valid reviewed 1.1.1 archive from chunk history and apply it
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA='2f1db0b1c09920d821ee518666cbd27c7e8666eb541898d9ebb6198d3c73447d'
          ROOT="$PWD"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          mapfile -t C0 < <(git log --all --format='%H' -- .codex/review40.chunk00 | awk '!seen[$0]++')
          mapfile -t C1 < <(git log --all --format='%H' -- .codex/review40.chunk01 | awk '!seen[$0]++')
          mapfile -t C2 < <(git log --all --format='%H' -- .codex/review40.chunk02 | awk '!seen[$0]++')

          test "${#C0[@]}" -gt 0
          test "${#C1[@]}" -gt 0
          test "${#C2[@]}" -gt 0

          echo "chunk00 historical candidates: ${#C0[@]}"
          echo "chunk01 historical candidates: ${#C1[@]}"
          echo "chunk02 historical candidates: ${#C2[@]}"

          FOUND=''
          FOUND_SHA=''
          FOUND_COMBO=''
          FALLBACK=''
          FALLBACK_SHA=''
          FALLBACK_COMBO=''
          ATTEMPTS=0

          for c0 in "${C0[@]}"; do
            for c1 in "${C1[@]}"; do
              for c2 in "${C2[@]}"; do
                ATTEMPTS=$((ATTEMPTS + 1))
                B64="$WORK/candidate-${ATTEMPTS}.b64"
                ARC="$WORK/candidate-${ATTEMPTS}.tar.gz"
                LIST="$WORK/candidate-${ATTEMPTS}.list"
                EXT="$WORK/extract-${ATTEMPTS}"

                : > "$B64"
                git show "${c0}:.codex/review40.chunk00" >> "$B64" || continue
                git show "${c1}:.codex/review40.chunk01" >> "$B64" || continue
                git show "${c2}:.codex/review40.chunk02" >> "$B64" || continue
                cat .codex/review40.chunk{03..07} >> "$B64"

                if ! base64 -d "$B64" > "$ARC" 2>/dev/null; then
                  continue
                fi
                if ! gzip -t "$ARC" 2>/dev/null; then
                  continue
                fi
                if ! tar -tzf "$ARC" > "$LIST" 2>/dev/null; then
                  continue
                fi
                if grep -Eq '(^/|(^|/)\.\.(/|$))' "$LIST"; then
                  continue
                fi

                mkdir -p "$EXT"
                tar -xzf "$ARC" -C "$EXT"
                PLUGIN="$(find "$EXT" -type f -name 'sabri-platform-foundation.php' -print -quit)"
                test -n "$PLUGIN" || continue
                if ! grep -Eq '^ \* Version: 1\.1\.1$|^\s*\* Version: 1\.1\.1\s*$' "$PLUGIN"; then
                  continue
                fi

                SHA="$(sha256sum "$ARC" | awk '{print $1}')"
                COMBO="chunk00=${c0} chunk01=${c1} chunk02=${c2}"
                echo "Valid 1.1.1 candidate: ${SHA} (${COMBO})"

                if [ "$SHA" = "$EXPECTED_SHA" ]; then
                  FOUND="$ARC"
                  FOUND_SHA="$SHA"
                  FOUND_COMBO="$COMBO"
                  break 3
                fi
                if [ -z "$FALLBACK" ]; then
                  cp "$ARC" "$WORK/fallback.tar.gz"
                  FALLBACK="$WORK/fallback.tar.gz"
                  FALLBACK_SHA="$SHA"
                  FALLBACK_COMBO="$COMBO"
                fi
              done
            done
          done

          if [ -z "$FOUND" ]; then
            if [ -n "$FALLBACK" ]; then
              FOUND="$FALLBACK"
              FOUND_SHA="$FALLBACK_SHA"
              FOUND_COMBO="$FALLBACK_COMBO"
              echo "Expected historical checksum was unavailable, but a structurally valid reviewed 1.1.1 archive was recovered."
            else
              echo "No structurally valid File 01 v1.1.1 reviewed archive could be recovered from Git history." >&2
              exit 1
            fi
          fi

          echo "Recovered archive SHA-256: ${FOUND_SHA}"
          echo "Recovered from: ${FOUND_COMBO}"

          tar -xzf "$FOUND" -C "$ROOT"
          rm -rf .codex
          rm -f REVIEW40-DIAGNOSTIC.md
          rm -f .github/workflows/apply-forty-round-source.yml

          test -f sabri-platform-foundation.php
          grep -Eq '^ \* Version: 1\.1\.1$|^\s*\* Version: 1\.1\.1\s*$' sabri-platform-foundation.php
          grep -q "define( 'SPF_VERSION', '1.1.1' )" sabri-platform-foundation.php

          {
            echo '# Forty-round reviewed-source recovery evidence'
            echo
            echo "- Recovered archive SHA-256: \`${FOUND_SHA}\`"
            echo "- Historical expected SHA-256: \`${EXPECTED_SHA}\`"
            echo "- Source combination: \`${FOUND_COMBO}\`"
            echo "- Structural validation: base64 decode PASS; gzip PASS; tar listing PASS; path safety PASS; plugin version 1.1.1 PASS."
            echo "- Applied on: 2026-08-08."
          } > REVIEW40-RECOVERY-EVIDENCE.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "fix: recover and apply File 01 forty-round reviewed source 1.1.1"
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
