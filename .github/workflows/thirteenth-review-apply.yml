name: Thirteenth Review Apply

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - .github/workflows/thirteenth-review-apply.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: file-01-thirteenth-review-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: codex/file-01-complete-foundation-1.0.0
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Reassemble and apply ten sequential corrective reviews
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tools/.th13-parts/part00.txt \
            tools/.th13-parts/part01.txt \
            tools/.th13-parts/part02.txt \
            tools/.th13-parts/part03.txt \
            tools/.th13-parts/part04.txt \
            tools/.th13-parts/part05.txt \
            tools/.th13-parts/tail00.txt \
            tools/.th13-parts/tail01.txt \
            tools/.th13-parts/tail02.txt \
            tools/.th13-parts/tail03.txt \
            > /tmp/apply-thirteenth-review.py
          python3 -m py_compile /tmp/apply-thirteenth-review.py
          python3 /tmp/apply-thirteenth-review.py
      - name: Pack exact final source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=dist -czf /tmp/file01-thirteenth-final-source.tgz .
          sha256sum /tmp/file01-thirteenth-final-source.tgz
          git rev-parse HEAD > /tmp/file01-thirteenth-final-head.txt
          git rev-parse HEAD^{tree} > /tmp/file01-thirteenth-final-tree.txt
      - name: Upload exact final source tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: file01-thirteenth-final-source
          path: |
            /tmp/file01-thirteenth-final-source.tgz
            /tmp/file01-thirteenth-final-head.txt
            /tmp/file01-thirteenth-final-tree.txt
          if-no-files-found: error
          retention-days: 30
