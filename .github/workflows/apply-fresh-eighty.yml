name: Apply File 01 Fresh Eighty Round Corrections

on:
  push:
    branches:
      - codex/file-01-complete-foundation-1.0.0
    paths:
      - '.github/workflows/apply-fresh-eighty.yml'

permissions:
  contents: write

concurrency:
  group: file-01-apply-fresh-eighty
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/file-01-complete-foundation-1.0.0
          fetch-depth: 0
      - name: Apply verified fresh 80-round patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.fresh-eighty.patch.00 tools/.fresh-eighty.patch.01 tools/.fresh-eighty.patch.02 tools/.fresh-eighty.patch.03 tools/.fresh-eighty.patch.04 > /tmp/fresh-eighty.patch
          sed -i \
            -e 's/^+--- \/dev\/null$/--- \/dev\/null/' \
            -e 's/^++++ b\/NINTH-FRESH-EIGHTY/+++ b\/NINTH-FRESH-EIGHTY/' \
            -e 's/^+@@ -0,0 +1,101 @@$/@@ -0,0 +1,101 @@/' \
            /tmp/fresh-eighty.patch
          patch -p1 --forward --batch < /tmp/fresh-eighty.patch

          # Historical regression used the old stale-lease marker. The corrected
          # runtime recovers an actually expired processing lease immediately.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/source-quality-tests.php')
          s = p.read_text()
          old = "'stale_processing_recovered'"
          new = "'expired_processing_lease_recovered'"
          if old not in s:
              raise SystemExit('Expected historical outbox assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY

          mapfile -t tracked < <(awk '{print $2}' SOURCE-CHECKSUMS.sha256)
          tracked+=( './tests/fresh-eighty-round-review-tests.php' './NINTH-FRESH-EIGHTY-ROUND-REVIEW-2026-08-09.md' )
          printf '%s\n' "${tracked[@]}" | LC_ALL=C sort -u > /tmp/spf-checksum-paths
          : > SOURCE-CHECKSUMS.sha256.new
          while IFS= read -r path; do
            [[ -f "$path" ]] || { echo "Checksum path missing: $path" >&2; exit 1; }
            sha256sum "$path" >> SOURCE-CHECKSUMS.sha256.new
          done < /tmp/spf-checksum-paths
          mv SOURCE-CHECKSUMS.sha256.new SOURCE-CHECKSUMS.sha256

          php -l tests/fresh-eighty-round-review-tests.php >/dev/null
          php tests/fresh-eighty-round-review-tests.php
          bash qa/run-tests.sh
          bash tools/build-package.sh

      - name: Commit clean corrected source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-fresh-eighty.yml tools/.fresh-eighty.patch.00 tools/.fresh-eighty.patch.01 tools/.fresh-eighty.patch.02 tools/.fresh-eighty.patch.03 tools/.fresh-eighty.patch.04
          git config user.name 'File 01 Corrective QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'File 01: complete fresh 80-round corrective review cycle'
          git push origin HEAD:codex/file-01-complete-foundation-1.0.0
